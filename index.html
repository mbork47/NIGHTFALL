<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0508">
<title>Nightfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Rajdhani',-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0508;color:#fff}
canvas{display:block;touch-action:none;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;font-family:'Rajdhani',sans-serif}
.bar{position:absolute;background:rgba(0,0,0,0.7);border:1px solid rgba(208,160,64,0.3);border-radius:6px;overflow:hidden;box-shadow:0 0 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5)}
.bar-fill{height:100%;transition:width 0.15s linear;position:relative}
.bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0.25),transparent);}
#hpBar{top:16px;left:16px;width:220px;height:22px;border-color:rgba(200,50,50,0.4)}
#hpFill{background:linear-gradient(90deg,#5a0808,#c03030,#ff6060);box-shadow:0 0 10px rgba(192,48,48,0.6)}
#xpBar{top:44px;left:16px;width:220px;height:12px;border-color:rgba(80,180,80,0.3)}
#xpFill{background:linear-gradient(90deg,#1a4a1a,#5fa35f,#a0ffa0);box-shadow:0 0 10px rgba(95,163,95,0.6)}
#bossBar{position:absolute;top:80px;left:50%;transform:translateX(-50%);width:min(320px,70vw);height:16px;background:rgba(0,0,0,0.85);border:1px solid #8a2020;border-radius:8px;overflow:hidden;display:none;box-shadow:0 0 20px rgba(138,32,32,0.5)}
#bossBarFill{height:100%;background:linear-gradient(90deg,#8a2020,#d04040,#4a1a5a);transition:width 0.1s linear;box-shadow:0 0 15px rgba(208,64,64,0.8)}
#bossName{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:14px;font-weight:900;color:#ff6060;letter-spacing:3px;text-shadow:0 0 15px #ff2020;display:none}
#stats{position:absolute;top:16px;right:60px;text-align:right;font-size:14px;font-weight:700;line-height:1.9;text-shadow:0 2px 8px #000;color:#c0b090;background:rgba(0,0,0,0.4);padding:8px 12px;border-radius:8px;border:1px solid rgba(160,140,100,0.15);backdrop-filter:blur(4px)}
#stats span{color:#ffd166;font-weight:800;text-shadow:0 0 10px rgba(255,209,102,0.5)}
#comboBadge{position:absolute;top:130px;left:50%;transform:translateX(-50%) scale(0);background:linear-gradient(135deg,#8a3010,#ffb020);color:#0a0a14;padding:8px 24px;border-radius:30px;font-size:16px;font-weight:900;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 0 30px rgba(255,176,32,0.6);letter-spacing:1px}
#comboBadge.show{transform:translateX(-50%) scale(1)}
#milestone{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.5);font-family:'Cinzel',serif;font-size:48px;font-weight:900;color:#ffd166;letter-spacing:6px;text-shadow:0 0 30px #ffb020, 0 0 60px #8a3010, 0 4px 20px #000;transition:all 0.6s cubic-bezier(0.34,1.56,0.64,1);opacity:0;pointer-events:none}
#milestone.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#weaponList{position:absolute;bottom:16px;left:16px;font-size:13px;font-weight:700;line-height:1.8;text-shadow:0 2px 4px #000;max-width:240px;color:#c0b090;display:flex;flex-wrap:wrap;gap:6px}
#weaponList .w{background:rgba(20,15,10,0.8);border:1px solid rgba(160,140,100,0.2);border-radius:8px;padding:5px 10px;backdrop-filter:blur(4px);transition:all 0.2s}
#weaponList .w.evolved{border-color:#ffd166;background:rgba(255,209,102,0.15);color:#ffd166;box-shadow:0 0 15px rgba(255,209,102,0.3)}
#toast{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%) translateY(-30px);background:rgba(15,10,8,0.95);border:1px solid #ffd166;border-radius:14px;padding:14px 24px;font-size:15px;font-weight:800;color:#ffd166;text-align:center;opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;max-width:80vw;box-shadow:0 0 30px rgba(255,209,102,0.2);backdrop-filter:blur(8px)}
#toast.show{opacity:1;transform:translate(-50%,-50%) translateY(0)}
#toast .sub{font-size:12px;color:rgba(200,180,140,0.8);margin-top:4px;font-weight:600}
#waveBanner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) scale(0.3);font-family:'Cinzel',serif;font-size:28px;font-weight:900;color:#ff6060;letter-spacing:4px;text-shadow:0 0 30px #ff2020, 0 4px 20px #000;transition:all 0.6s cubic-bezier(0.34,1.56,0.64,1);opacity:0;pointer-events:none;text-align:center;line-height:1.4}
#waveBanner.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#waveBanner .sub{font-size:15px;color:#c0b090;letter-spacing:2px;margin-top:8px;font-family:'Rajdhani',sans-serif}
#pauseBtn{position:fixed;top:16px;right:16px;width:40px;height:40px;background:rgba(20,15,10,0.9);border:1px solid rgba(208,160,64,0.4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#ffd166;z-index:25;cursor:pointer;pointer-events:auto;transition:all 0.2s;backdrop-filter:blur(4px);box-shadow:0 0 15px rgba(0,0,0,0.5)}
#pauseBtn:hover{border-color:#ffd166;background:rgba(255,209,102,0.1);transform:scale(1.05)}
#pauseBtn:active{transform:scale(0.95)}
#pauseScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,3,5,0.95);z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;pointer-events:auto;backdrop-filter:blur(12px)}
#pauseScreen h1{font-family:'Cinzel',serif;font-size:36px;color:#ffd166;letter-spacing:6px;margin-bottom:20px;text-shadow:0 0 30px rgba(255,209,102,0.5)}
#pauseScreen button{padding:14px 40px;font-family:'Cinzel',serif;font-size:16px;font-weight:900;color:#0a0508;background:linear-gradient(135deg,#ffd166,#ffb020);border:none;border-radius:14px;cursor:pointer;box-shadow:0 0 30px rgba(255,176,32,0.4);transition:all 0.25s;letter-spacing:1px;min-width:220px}
#pauseScreen button:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(255,176,32,0.6)}
#pauseScreen button.sec{background:rgba(30,20,15,0.8);color:#c0b090;box-shadow:none;font-size:14px;padding:12px 30px;font-family:'Rajdhani',sans-serif;font-weight:700;border:1px solid rgba(160,140,100,0.3)}
#pauseScreen button.sec:hover{border-color:#ffd166;color:#ffd166}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,3,5,0.92);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;pointer-events:auto;overflow-y:auto;backdrop-filter:blur(8px)}
#levelUpScreen h1{font-family:'Cinzel',serif;font-size:32px;color:#ffd166;letter-spacing:3px;margin-bottom:12px;text-shadow:0 0 30px rgba(255,209,102,0.5)}
.upgradeCard{width:min(340px,90vw);padding:16px 20px;background:linear-gradient(135deg,rgba(60,40,80,0.8),rgba(40,20,50,0.6));border:1px solid rgba(160,100,200,0.4);border-radius:14px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.upgradeCard:hover{transform:translateY(-2px);border-color:#ffd166;box-shadow:0 0 25px rgba(255,209,102,0.2)}
.upgradeCard:active{transform:scale(0.97)}
.upgradeCard .icon{font-size:30px;width:48px;text-align:center;filter:drop-shadow(0 0 8px rgba(255,209,102,0.5))}
.upgradeCard .info{flex:1}
.upgradeCard .name{font-size:16px;font-weight:800;color:#ffd166;font-family:'Cinzel',serif;letter-spacing:1px}
.upgradeCard .desc{font-size:12px;color:rgba(200,180,140,0.8);margin-top:3px;font-weight:600}
.upgradeCard .lvl{font-size:11px;color:#a060d0;font-weight:800;margin-top:4px;letter-spacing:1px}
#startScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,#1a0808 0%,#050205 100%);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;pointer-events:auto;overflow-y:auto}
#startScreen h1{font-family:'Cinzel',serif;font-size:38px;font-weight:900;letter-spacing:6px;text-align:center;background:linear-gradient(135deg,#ff6060,#ffd166);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 30px rgba(255,96,96,0.4));margin-bottom:4px}
#startScreen .sub{font-size:13px;color:rgba(160,140,100,0.6);margin-top:-8px;letter-spacing:4px;font-weight:600}
.sectionTitle{font-family:'Cinzel',serif;font-size:13px;font-weight:800;color:rgba(255,209,102,0.7);letter-spacing:3px;margin-top:10px;margin-bottom:4px;text-shadow:0 0 15px rgba(255,209,102,0.2)}
.charGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:min(380px,92vw)}
.charCard{padding:10px 6px;background:rgba(30,20,15,0.7);border:1px solid rgba(100,80,60,0.3);border-radius:12px;cursor:pointer;text-align:center;transition:all 0.25s;backdrop-filter:blur(4px)}
.charCard:hover{border-color:rgba(255,209,102,0.5);transform:translateY(-2px)}
.charCard.selected{border-color:#ffd166;background:rgba(255,209,102,0.15);box-shadow:0 0 20px rgba(255,209,102,0.3);transform:translateY(-2px)}
.charCard:active{transform:scale(0.96)}
.charCard .emoji{font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}
.charCard .name{font-size:12px;font-weight:800;margin-top:4px;color:#e0c080;font-family:'Cinzel',serif;letter-spacing:0.5px}
.charCard .wep{font-size:9px;color:rgba(160,140,100,0.7);margin-top:2px;font-weight:600}
.mapGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:min(380px,92vw)}
.mapCard{padding:8px;background:rgba(30,20,15,0.7);border:1px solid rgba(100,80,60,0.3);border-radius:12px;cursor:pointer;text-align:center;position:relative;overflow:hidden;transition:all 0.25s;backdrop-filter:blur(4px)}
.mapCard:hover{border-color:rgba(255,209,102,0.5);transform:translateY(-2px)}
.mapCard .mapPreview{width:100%;height:44px;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-size:22px;filter:brightness(0.8);box-shadow:inset 0 0 20px rgba(0,0,0,0.6)}
.mapCard.selected{border-color:#ffd166;background:rgba(255,209,102,0.15);box-shadow:0 0 20px rgba(255,209,102,0.3);transform:translateY(-2px)}
.mapCard.locked{opacity:0.5;cursor:not-allowed;background:rgba(0,0,0,0.5);filter:grayscale(0.8)}
.mapCard .name{font-size:11px;font-weight:800;margin-top:2px;color:#e0c080;font-family:'Cinzel',serif;letter-spacing:0.5px}
.mapCard .lock{font-size:9px;color:#ff6060;margin-top:3px;line-height:1.3;font-weight:700}
.mapCard .lockIcon{position:absolute;top:6px;right:8px;font-size:16px;z-index:2;filter:drop-shadow(0 0 5px rgba(255,96,96,0.8))}
.goldBox{background:linear-gradient(135deg,rgba(255,209,102,0.15),rgba(255,176,32,0.05));border:1px solid rgba(255,209,102,0.4);border-radius:12px;padding:8px 20px;font-size:15px;font-weight:800;color:#ffd166;box-shadow:0 0 20px rgba(255,209,102,0.15);backdrop-filter:blur(4px);letter-spacing:1px}
#startScreen button{padding:14px 40px;font-family:'Cinzel',serif;font-size:16px;font-weight:900;color:#0a0508;background:linear-gradient(135deg,#ffd166,#ffb020);border:none;border-radius:14px;cursor:pointer;box-shadow:0 0 30px rgba(255,176,32,0.4), 0 8px 24px rgba(0,0,0,0.5);pointer-events:auto;margin-top:8px;letter-spacing:2px;transition:all 0.25s;position:relative;overflow:hidden}
#startScreen button:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(255,176,32,0.6), 0 12px 30px rgba(0,0,0,0.6)}
#startScreen button:active{transform:scale(0.97)}
#startScreen button.sec{background:rgba(30,20,15,0.8);color:#c0b090;box-shadow:none;font-size:13px;padding:10px 24px;font-family:'Rajdhani',sans-serif;font-weight:700;border:1px solid rgba(160,140,100,0.3);letter-spacing:1px}
#startScreen button.sec:hover{border-color:#ffd166;color:#ffd166;background:rgba(255,209,102,0.1)}
#lifetimeStats{display:flex;gap:16px;font-size:12px;color:rgba(160,140,100,0.7);margin-top:0;font-weight:600;background:rgba(0,0,0,0.3);padding:6px 16px;border-radius:20px;border:1px solid rgba(160,140,100,0.1)}
#lifetimeStats span{color:#ffd166;font-weight:800}
#gameOverScreen h1{font-family:'Cinzel',serif;font-size:42px;color:#ff4040;letter-spacing:6px;margin-bottom:12px;text-shadow:0 0 40px rgba(255,64,64,0.6)}
#gameOverScreen .stat{font-size:15px;color:rgba(200,180,140,0.8);font-weight:600}
#gameOverScreen .stat b{color:#ffd166;font-size:20px;font-family:'Cinzel',serif}
#gameOverScreen .goldEarned{font-size:18px;color:#ffd166;font-weight:800;margin-top:10px;text-shadow:0 0 15px rgba(255,209,102,0.4)}
#gameOverScreen button{margin-top:14px;padding:14px 40px;font-family:'Cinzel',serif;font-size:16px;font-weight:900;color:#0a0508;background:linear-gradient(135deg,#ffd166,#ffb020);border:none;border-radius:14px;cursor:pointer;box-shadow:0 0 30px rgba(255,176,32,0.4);transition:all 0.25s;letter-spacing:1px}
#gameOverScreen button:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(255,176,32,0.6)}
#gameOverScreen button.sec{background:rgba(30,20,15,0.8);color:#c0b090;box-shadow:none;font-size:13px;padding:10px 24px;font-family:'Rajdhani',sans-serif;font-weight:700;border:1px solid rgba(160,140,100,0.3)}
#gameOverScreen button.sec:hover{border-color:#ffd166;color:#ffd166}
#metaScreen h1{font-family:'Cinzel',serif;font-size:28px;color:#ffd166;margin-bottom:8px;text-shadow:0 0 30px rgba(255,209,102,0.4);letter-spacing:2px}
#metaScreen .goldShow{font-size:18px;color:#ffd166;font-weight:800;margin-bottom:12px;text-shadow:0 0 15px rgba(255,209,102,0.4)}
.metaRow{width:min(360px,92vw);padding:12px 16px;background:rgba(30,20,15,0.7);border:1px solid rgba(100,80,60,0.3);border-radius:12px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:6px;transition:all 0.2s;backdrop-filter:blur(4px)}
.metaRow:hover{border-color:rgba(255,209,102,0.5);transform:translateX(4px)}
.metaRow.disabled{opacity:0.35;cursor:not-allowed}
.metaRow .icon{font-size:24px;width:36px;text-align:center;filter:drop-shadow(0 0 6px rgba(255,209,102,0.3))}
.metaRow .info{flex:1}
.metaRow .name{font-size:14px;font-weight:800;color:#e0c080;font-family:'Cinzel',serif;letter-spacing:0.5px}
.metaRow .desc{font-size:11px;color:rgba(160,140,100,0.6);margin-top:3px;font-weight:600}
.metaRow .price{font-size:14px;color:#ffd166;font-weight:800;background:rgba(255,209,102,0.1);padding:4px 10px;border-radius:8px;border:1px solid rgba(255,209,102,0.2)}
#metaScreen button{margin-top:16px;padding:12px 36px;font-family:'Cinzel',serif;font-size:15px;font-weight:900;color:#0a0508;background:linear-gradient(135deg,#ffd166,#ffb020);border:none;border-radius:14px;cursor:pointer;box-shadow:0 0 30px rgba(255,176,32,0.4);transition:all 0.25s;letter-spacing:1px}
#metaScreen button:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(255,176,32,0.6)}
.statsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(360px,92vw);margin-top:12px}
.statItem{background:rgba(30,20,15,0.7);padding:10px;border-radius:10px;font-size:11px;color:rgba(160,140,100,0.7);font-weight:600;border:1px solid rgba(100,80,60,0.2);backdrop-filter:blur(4px)}
.statItem b{display:block;font-size:18px;color:#ffd166;margin-top:4px;font-family:'Cinzel',serif}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div class="bar" id="hpBar"><div class="bar-fill" id="hpFill" style="width:100%"></div></div>
<div class="bar" id="xpBar"><div class="bar-fill" id="xpFill" style="width:0%"></div></div>
<div id="bossName">BOSS</div>
<div id="bossBar"><div id="bossBarFill" style="width:100%"></div></div>
<div id="stats">
⏱ <span id="time">00:00</span><br>
💀 <span id="kills">0</span><br>
⭐ <span id="level">1</span><br>
💰 <span id="gold">0</span>
</div>
<div id="comboBadge"></div>
<div id="milestone"></div>
<div id="waveBanner"></div>
<div id="toast"></div>
<div id="weaponList"></div>
</div>
<div id="pauseBtn">⏸</div>
<div id="pauseScreen">
<h1>DURAKLATILDI</h1>
<button id="btnResume">DEVAM ET</button>
<button class="sec" id="btnPauseMenu">ANA MENÜ</button>
</div>
<div id="startScreen">
<h1>NIGHTFALL</h1>
<div class="sub">SURVIVORS-LIKE</div>
<div class="goldBox">💰 <span id="startGold">0</span> Altın</div>
<div id="lifetimeStats">
💀 Toplam Kill: <span id="lifetimeKills">0</span> · 👑 Boss: <span id="lifetimeBosses">0</span>
</div>
<div class="sectionTitle">KARAKTER</div>
<div class="charGrid" id="charGrid"></div>
<div class="sectionTitle">HARİTA</div>
<div class="mapGrid" id="mapGrid"></div>
<button id="btnStart">OYUNA BAŞLA</button>
<button class="sec" id="btnMeta">⚙️ KALICI YÜKSELTMELER</button>
</div>
<div class="screen" id="levelUpScreen">
<h1>LEVEL UP!</h1>
<div id="upgradeList"></div>
</div>
<div class="screen" id="metaScreen">
<h1>KALICI YÜKSELTMELER</h1>
<div class="goldShow">💰 <span id="metaGold">0</span> Altın</div>
<div id="metaList"></div>
<button id="btnCloseMeta">GERİ DÖN</button>
</div>
<div class="screen" id="gameOverScreen">
<h1>ÖLDÜN</h1>
<div class="stat">Hayatta kaldın: <b id="finalTime">00:00</b></div>
<div class="stat">Öldürdüğün: <b id="finalKills">0</b></div>
<div class="stat">Seviye: <b id="finalLevel">1</b></div>
<div class="goldEarned">💰 Kazandığın: <span id="goldEarned">0</span> Altın</div>
<div class="statsGrid">
<div class="statItem">Toplam Hasar<b id="statDamage">0</b></div>
<div class="statItem">Kritik Vuruş<b id="statCrit">0</b></div>
<div class="statItem">Toplanan Gem<b id="statGems">0</b></div>
<div class="statItem">Boss Kesilen<b id="statBosses">0</b></div>
</div>
<button id="btnRestart">TEKRAR OYNA</button>
<button class="sec" id="btnBackToMenu">ANA MENÜ</button>
</div>

<script>
(function(){
'use strict';

// Hata göstergesi
window.onerror = function(msg, url, line){
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;z-index:999999;padding:10px;font-size:11px;font-family:monospace;';
  d.textContent = 'HATA: ' + msg + ' @ satır ' + line;
  document.body.appendChild(d);
};

// === TÜM DEĞİŞKENLER ===
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W=0, H=0, DPR=1;

// Karakterler
var CHARACTERS = [
  { id:'warrior', spriteType:'warrior', name:'Savaşçı', emoji:'⚔️', weapon:'knife', desc:'Bıçak - Tank', hp:140, speed:200, damageMult:0.95 },
  { id:'rogue', spriteType:'rogue', name:'Suikastçı', emoji:'🗡️', weapon:'knife', desc:'Hızlı', hp:75, speed:280, damageMult:0.85 },
  { id:'mage', spriteType:'mage', name:'Büyücü', emoji:'🔮', weapon:'fireball', desc:'Ateş', hp:70, speed:195, damageMult:1.25 },
  { id:'archer', spriteType:'archer', name:'Okçu', emoji:'🏹', weapon:'spear', desc:'Uzaktan', hp:95, speed:235, damageMult:1.05 },
  { id:'bloodmage', spriteType:'bloodmage', name:'Kan Büyücüsü', emoji:'🩸', weapon:'lightning', desc:'Şimşek - Regen', hp:85, speed:215, damageMult:1.15, regenBonus:1 },
  { id:'necromancer', spriteType:'necromancer', name:'Nekromancer', emoji:'💀', weapon:'poison', desc:'Zehir', hp:80, speed:210, damageMult:1.1 }
];
var selectedChar = 0;

// Haritalar

  { id:'desert', name:'Kuru Çöl', emoji:'🏜️', bg1:'#2a2018', bg2:'#100a05', ground:'#302418', enemyTypes:['mummy','scorpion','sandDemon'], bossSprite:'mummy', bossMechanic:'slow', enemyMult:0.9, goldMult:1.3, unlock:{type:'kills',value:2000}, unlockText:'2000 kill', envType:'desert' },

  { id:'hell', name:'Cehennem', emoji:'🔥', bg1:'#2a0808', bg2:'#050000', ground:'#200505', enemyTypes:['flameImp','emberDemon','hellHound'], bossSprite:'emberDemon', bossMechanic:'firering', enemyMult:1.6, goldMult:2.0, unlock:{type:'kills',value:5000}, unlockText:'5000 kill', envType:'hell' }
];
var selectedMap = 0;

// Kayıt
var SAVE_KEY = 'nightfall_save_v6';
var meta = { gold:0, upgrades:{hp:0,damage:0,speed:0,cooldown:0,crit:0,regen:0}, lifetimeKills:0, lifetimeBosses:0, lifetimeGoldSpent:0 };
try {
  var raw = localStorage.getItem(SAVE_KEY);
  if (raw){
    var p = JSON.parse(raw);
    if (p.gold !== undefined) meta.gold = p.gold;
    if (p.upgrades) for (var k in meta.upgrades) if (p.upgrades[k] !== undefined) meta.upgrades[k] = p.upgrades[k];
    if (p.lifetimeKills !== undefined) meta.lifetimeKills = p.lifetimeKills;
    if (p.lifetimeBosses !== undefined) meta.lifetimeBosses = p.lifetimeBosses;
    if (p.lifetimeGoldSpent !== undefined) meta.lifetimeGoldSpent = p.lifetimeGoldSpent;
  }
} catch(e){}
function saveMeta(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch(e){} }

// Oyun değişkenleri
var STATE = 'start';
var gameTime = 0, kills = 0, goldCollected = 0, lastTime = 0;
var shake = 0, nextMilestone = 60, lastKillTime = 0;
var killStreak = 0, comboActive = 0;
var totalDamage = 0, totalCrits = 0, gemsCollected = 0, bossesKilled = 0;
var now = 0, playerAnimFrame = 0, playerAnimTimer = 0;
var wave = 1, currentWaveTypes = [];
var currentMap = MAPS[0];
var bossMechanicTimer = 0;
var player = { x:0, y:0, hp:100, maxHp:100, speed:220, radius:14, xp:0, xpNext:5, level:1, invulnUntil:0, facing:1, hitFlash:0, damageMult:1.0, cooldownMult:1.0, critChance:0, critMult:2.0, regenRate:0, regenTimer:0, spriteType:'warrior' };
var cam = { x:0, y:0 };
var input = { active:false, dx:0, dy:0, mag:0 };
var enemies = [], bullets = [], gems = [], damageNumbers = [], particles = [], chests = [];
var enemySpawnTimer = 0, nextBossTime = 45000, activeBoss = null;
var weapons = {};
var passives = {
  damage: { name:'Güç', icon:'💪', level:0, desc:'+15% hasar' },
  speed: { name:'Hız', icon:'👟', level:0, desc:'+15 hareket hızı' },
  area: { name:'Alan', icon:'💥', level:0, desc:'+20% alan' },
  cooldown: { name:'Çabukluk', icon:'⚡', level:0, desc:'-12% bekleme' },
  magnet: { name:'Mıknatıs', icon:'🧲', level:0, desc:'+100 toplama' },
  crit: { name:'Kritik', icon:'🎯', level:0, desc:'+10% kritik' },
  regen: { name:'Yenilenme', icon:'💚', level:0, desc:'+2 HP/2sn' }
};
var EVOLUTIONS = {
  knife: { passive:'damage', name:'Bin Bıçak' },
  spear: { passive:'area', name:'Ölüm Sarmalı' },
  fireball: { passive:'cooldown', name:'Cehennem Ateşi' },
  lightning: { passive:'magnet', name:'Gök Gürültüsü' },
  boomerang: { passive:'speed', name:'Ölüm Halkası' },
  poison: { passive:'regen', name:'Veba Bulutu' },
  hammer: { passive:'area', name:'Yıldırım Çekici' },
  iceSpear: { passive:'crit', name:'Buz Kırağı' },
  flameSword: { passive:'damage', name:'Alev Fırtınası' }
};
var bgTile = 256, bgPattern = null;
var vignetteCanvas = null;
var envObjects = [];

// ===== FONKSİYONLAR =====

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

function isMapUnlocked(map){
  if (!map.unlock) return true;
  var t = map.unlock.type, v = map.unlock.value;
  if (t === 'kills') return meta.lifetimeKills >= v;
  if (t === 'bosses') return meta.lifetimeBosses >= v;
  if (t === 'goldSpent') return meta.lifetimeGoldSpent >= v;
  return true;
}

function buildBg(){
  if (W <= 0 || H <= 0) return;
  var tile = document.createElement('canvas');
  tile.width = bgTile; tile.height = bgTile;
  var tc = tile.getContext('2d');
  var m = MAPS[selectedMap];
  tc.fillStyle = m.ground;
  tc.fillRect(0, 0, bgTile, bgTile);
  for (var i=0;i<80;i++){
    tc.fillStyle = 'rgba(0,0,0,' + (0.05 + Math.random()*0.2) + ')';
    tc.beginPath(); tc.arc(Math.random()*bgTile, Math.random()*bgTile, 3+Math.random()*15, 0, Math.PI*2); tc.fill();
  }
  for (var i=0;i<40;i++){
    tc.fillStyle = 'rgba(255,255,255,' + (Math.random()*0.04) + ')';
    tc.fillRect(Math.random()*bgTile, Math.random()*bgTile, 1+Math.random()*3, 1+Math.random()*3);
  }
  bgPattern = ctx.createPattern(tile, 'repeat');
}

function buildVignette(){
  if (W <= 0 || H <= 0) return;
  var c = document.createElement('canvas');
  c.width = Math.floor(W); c.height = Math.floor(H);
  var vc = c.getContext('2d');
  var grad = vc.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.9);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.6, 'rgba(0,0,0,0.1)');
  grad.addColorStop(1, 'rgba(0,0,0,0.7)');
  vc.fillStyle = grad;
  vc.fillRect(0, 0, W, H);
  vignetteCanvas = c;
}

function generateEnvObjects(){
  envObjects = [];
  var areaSize = 2000;
  for (var i=0;i<30;i++){
    envObjects.push({ x:(Math.random()-0.5)*areaSize, y:(Math.random()-0.5)*areaSize, size: 0.7 + Math.random()*0.6, rot: Math.random()*Math.PI*2 });
  }
}

function drawEnvObject(o, camX, camY){
  var sx = o.x - camX;
  var sy = o.y - camY;
  if (sx < -100 || sx > W+100 || sy < -100 || sy > H+100) return;
  var s = o.size;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(o.rot);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 8*s, 18*s, 6*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4a4a4a';
  ctx.beginPath();
  ctx.moveTo(-15*s, 5*s); ctx.lineTo(-10*s, -12*s); ctx.lineTo(5*s, -15*s); ctx.lineTo(15*s, -5*s); ctx.lineTo(12*s, 8*s);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHero(x, y, type, facing, frame){
  var P = { body:'#5a6a7a', head:'#3a4a5a', weapon:'#a0a0b0' };
  if (type === 'mage' || type === 'necromancer') P = { body:'#5a2a4a', head:'#3a1a2a', weapon:'#8a6a3a' };
  ctx.save();
  ctx.translate(x, y);
  if (facing < 0) ctx.scale(-1, 1);
  var bob = (frame===1||frame===3)?-2:0;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 18, 12, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = P.head;
  ctx.fillRect(-6, 4+bob, 5, 14);
  ctx.fillRect(1, 4+bob, 5, 14);
  ctx.fillStyle = P.body;
  ctx.fillRect(-9, -12+bob, 18, 18);
  ctx.fillStyle = P.head;
  ctx.fillRect(-8, -26+bob, 16, 8);
  ctx.fillStyle = '#000';
  ctx.fillRect(-4, -19+bob, 2, 2);
  ctx.fillRect(2, -19+bob, 2, 2);
  ctx.fillStyle = P.weapon;
  ctx.fillRect(12, -18+bob, 3, 18);
  ctx.restore();
}

function drawEnemy(e, camX, camY){
  var x = e.x - camX, y = e.y - camY;
  var r = e.radius;
  var bob = (e.frame % 2 === 0) ? 0 : -2;
  var scale = e.isBoss ? 2.2 : e.isElite ? 1.5 : 1.0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, r-2, r*0.9, r*0.3, 0, 0, Math.PI*2); ctx.fill();
  // Basit yaratık çizimi
  ctx.fillStyle = '#4a6a3a';
  ctx.beginPath(); ctx.arc(0, 0+bob, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a5a2a';
  ctx.beginPath(); ctx.arc(0, -r*0.3+bob, r*0.7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#c04040';
  ctx.beginPath(); ctx.arc(-r*0.3, -r*0.2+bob, r*0.18, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.3, -r*0.2+bob, r*0.18, 0, Math.PI*2); ctx.fill();
  if (e.hitFlash > 0){
    ctx.fillStyle = 'rgba(255,220,220,' + Math.min(0.8, e.hitFlash*4) + ')';
    ctx.beginPath(); ctx.arc(0, 0+bob, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  if (e.isBoss || e.isElite || e.hp < e.maxHp){
    var bw = r*2.5*scale, bh = 3, by = y - r*scale - 12;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(x-bw/2, by, bw, bh);
    ctx.fillStyle = '#c03030';
    ctx.fillRect(x-bw/2, by, bw*(e.hp/e.maxHp), bh);
  }
}

// === ANA RENDER ===
function render(){
  var camX = cam.x - W/2;
  var camY = cam.y - H/2;
  if (bgPattern){
    ctx.save();
    var ox = -((camX % bgTile) + bgTile) % bgTile - bgTile;
    var oy = -((camY % bgTile) + bgTile) % bgTile - bgTile;
    ctx.translate(ox, oy);
    ctx.fillStyle = bgPattern;
    ctx.fillRect(0, 0, W + bgTile*2, H + bgTile*2);
    ctx.restore();
  } else {
    ctx.fillStyle = currentMap.ground;
    ctx.fillRect(0, 0, W, H);
  }
  for (var i=0;i<envObjects.length;i++) drawEnvObject(envObjects[i], camX, camY);
  for (var i=0;i<gems.length;i++){
    var g = gems[i];
    var sx = g.x - camX, sy = g.y - camY;
    ctx.fillStyle = '#5fb390';
    ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI*2); ctx.fill();
  }
  for (var i=0;i<enemies.length;i++){
    var e = enemies[i];
    var sx = e.x - camX, sy = e.y - camY;
    if (sx < -100 || sx > W+100 || sy < -100 || sy > H+100) continue;
    drawEnemy(e, camX, camY);
  }
  for (var i=0;i<bullets.length;i++){
    var b = bullets[i];
    var sx = b.x - camX, sy = b.y - camY;
    ctx.fillStyle = b.color || '#fff';
    ctx.beginPath(); ctx.arc(sx, sy, b.radius, 0, Math.PI*2); ctx.fill();
  }
  var px2 = player.x - camX, py2 = player.y - camY;
  drawHero(px2, py2, player.spriteType, player.facing, playerAnimFrame);
  if (vignetteCanvas){ ctx.drawImage(vignetteCanvas, 0, 0, W, H); }
}

// === OYUN DÖNGÜSÜ (BASİT) ===
function loop(t){
  requestAnimationFrame(loop);
  now = t;
  if (STATE === 'playing'){
    var dt = Math.min(0.05, (t-lastTime)/1000);
    lastTime = t;
    gameTime += dt*1000;
    // Basit hareket
    if (input.mag > 0.1){
      player.x += input.dx*player.speed*input.mag*dt;
      player.y += input.dy*player.speed*input.mag*dt;
    }
    cam.x = player.x; cam.y = player.y;
    // Düşman spawn
    enemySpawnTimer -= dt;
    if (enemySpawnTimer <= 0){
      enemySpawnTimer = 0.8;
      var ang = Math.random()*Math.PI*2;
      var radius = Math.max(W,H)*0.8;
      enemies.push({ x:player.x + Math.cos(ang)*radius, y:player.y + Math.sin(ang)*radius, hp:20, maxHp:20, speed:80, radius:13, type:'zombie', dmgMult:1.0, hitFlash:0, isBoss:false, isElite:false, xpValue:1, gold FValue:1, frame:0, animTimer:0, slowUntil:0 });
    }
    // Düşman hareket
    for (var i=enemies.length-1;i>=0;i--){
      var e = enemies[i];
      var dx = player.x-e.x, dy = player.y-e.y;
      var d = Math.sqrt(dx*dx+dy*dy);
      if (d > 0.01){ e.x += (dx/d)*e.speed*dt; e.y += (dy/d)*e.speed*dt; }
      if (d < player.radius + e.radius){
        player.hp -= 5;
        e.x -= (dx/d)*50; e.y -= (dy/d)*50;
        if (player.hp <= 0){ player.hp = 0; gameOver(); return; }
      }
    }
    updateUI();
  }
  if (STATE === 'playing' || STATE === 'paused'){ render(); }
}

function updateUI(){
  document.getElementById('hpFill').style.width = Math.max(0, player.hp/player.maxHp*100)+'%';
  var sec = Math.floor(gameTime/1000);
  var m = Math.floor(sec/60), s = sec%60;
  document.getElementById('time').textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  document.getElementById('kills').textContent = kills;
  document.getElementById('level').textContent = player.level;
  document.getElementById('gold').textContent = goldCollected;
}

// === MENÜONKSİYONLARI ===
function renderCharGrid(){
  var grid = document.getElementById('charGrid');
  if (!grid) return;
  grid.innerHTML = '';
  for (var i=0;i<CHARACTERS.length;i++){
    var c = CHARACTERS[i];
    var card = document.createElement('div');
    card.className = 'charCard' + (i === selectedChar ? ' selected' : '');
    card.innerHTML = '<div class="emoji">'+c.emoji+'</div>'+'<div class="name">'+c.name+'</div>'+'<div class="wep">'+c.desc+'</div>';
    (function(idx){ card.addEventListener('click', function(){ selectedChar = idx; renderCharGrid(); }); })(i);
    grid.appendChild(card);
  }
}

function renderMapGrid(){
  var grid = document.getElementById('mapGrid');
  if (!grid) return;
  grid.innerHTML = '';
  for (var i=0;i<MAPS.length;i++){
    var m = MAPS[i];
    var unlocked = isMapUnlocked(m);
    var card = document.createElement('div');
    card.className = 'mapCard' + (i === selectedMap ? ' selected' : '') + (!unlocked ? ' locked' : '');
    var previewStyle = 'background:linear-gradient(180deg,'+m.bg1+','+m.bg2+')';
    var lockHtml = '';
    if (!unlocked){ lockHtml = '<div class="lockIcon">🔒</div><div class="lock">'+m.unlockText+'</div>'; }
    card.innerHTML = '<div class="mapPreview" style="'+previewStyle+'">'+m.emoji+'</div>'+'<div class="name">'+m.name+'</div>' + lockHtml;
    (function(idx, isUnlocked){
      card.addEventListener('click', function(){
        if (!isUnlocked) return;
        selectedMap = idx;
        renderMapGrid();
      });
    })(i, unlocked);
    grid.appendChild(card);
  }
}

function updateStartScreenStats(){
  document.getElementById('startGold').textContent = meta.gold;
  document.getElementById('lifetimeKills').textContent = meta.lifetimeKills;
  document.getElementById('lifetimeBosses').textContent = meta.lifetimeBosses;
}

// === OYUN BAŞLATMA ===
function resetGame(){
  gameTime = 0; kills = 0; goldCollected = 0;
  enemies = []; bullets = []; gems = []; damageNumbers = []; particles = []; chests = [];
  enemySpawnTimer = 0; nextBossTime = 45000; activeBoss = null;
  shake = 0; totalDamage = 0; totalCrits = 0; gemsCollected = 0; bossesKilled = 0;
  wave = 1;
  currentMap = MAPS[selectedMap];
  buildBg(); buildVignette(); generateEnvObjects();
  var ch = CHARACTERS[selectedChar];
  player.x = 0; player.y = 0;
  player.maxHp = ch.hp; player.hp = ch.hp;
  player.speed = ch.speed;
  player.level = 1;
  player.spriteType = ch.spriteType;
  player.invulnUntil = 0; player.hitFlash = 0;
  cam.x = 0; cam.y = 0;
  input.active = false; input.mag = 0;
}

function startGame(){
  resetGame();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('pauseScreen').style.display = 'none';
  STATE = 'playing';
  lastTime = performance.now();
  updateUI();
}

function gameOver(){
  STATE = 'gameover';
  meta.gold += goldCollected;
  meta.lifetimeKills += kills;
 x  saveMeta();
  document.getElementById('finalKills').textContent = kills;
  document.getElementById('goldEarned').textContent = goldCollected;
  document.getElementById('gameOverScreen').style.display = 'flex';
}

function backToMenu(){
  STATE = 'start';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
  renderCharGrid();
  renderMapGrid();
  updateStartScreenStats();
}

function pauseGame(){
  if (STATE !== 'playing') return;
  STATE = 'paused';
  document.getElementById('pauseScreen').style.display = 'flex';
}
function resumeGame(){
  if (STATE !== 'paused') return;
  STATE = 'playing';
  document.getElementById('pauseScreen').style.display = 'none';
  lastTime = performance.now();
}

// === OLAY DİNLEYİCİLERİ ===
document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnRestart').addEventListener('click', startGame);
document.getElementById('btnBackToMenu').addEventListener('click', backToMenu);
document.getElementById('pauseBtn').addEventListener('click', pauseGame);
document.getElementById('btnResume').addEventListener('click', resumeGame);
document.getElementById('btnPauseMenu').addEventListener('click', backToMenu);

// Dokunmatik kontrol
function getPointerPos(e){
  var rect = canvas.getBoundingClientRect();
  var t = e.touches ? e.touches[0] : e;
  return {: t.clientX - rect.left, y: t.clientY - rect.top };
}
function onDown(e){
  e.preventDefault();
  if (STATE !== 'playing') return;
  var p = getPointerPos(e);
  input.active = true;
  var dx = p.x - W/2, dy = p.y - H/2;
  var m = Math.sqrt(dx*dx+dy*dy);
  if (m > 5){ input.dx = dx/m; input.dy = dy/m; input.mag = Math.min(1, m/80); }
}
function onMove(e){
  if (STATE !== 'playing' || !input.active) return;
  e.preventDefault();
  var p = getPointerPos(e);
  var dx = p.x - W/2, dy = p.y - H/2;
  var m = Math.sqrt(dx*dx+dy*dy);
  if (m > 5){ input.dx = dx/m; input.dy = dy/m; input.mag = Math.min(1, m/80); }
}
function onUp(e){ input.active = false; input.mag = 0; input.dx = 0; input.dy = 0; }

canvas.addEventListener('pointerdown', onDown, {passive:false});
canvas.addEventListener('pointermove', onMove, {passive:false});
canvas.addEventListener('pointerup', onUp, {passive:false});
canvas.addEventListener('pointercancel', onUp, {passive:false});
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

// === BAŞLAT ===
window.addEventListener('load', function(){
  resize();
  renderCharGrid();
  renderMapGrid();
  updateStartScreenStats();
  requestAnimationFrame(loop);
});

})();
  </script>
