<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0508">
<title>Nightfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Rajdhani',-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0508;color:#fff}
canvas{display:block;touch-action:none;width:100%;height:100%}

/* --- ÜST BİLGİ PANELİ (YENİ) --- */
#topPanel{position:fixed;top:0;left:0;right:0;height:50px;background:linear-gradient(180deg,rgba(10,5,8,0.95),rgba(10,5,8,0.7));border-bottom:1px solid rgba(208,160,64,0.3);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 12px;pointer-events:none;font-family:'Rajdhani',sans-serif}
#topPanel .left{display:flex;align-items:center;gap:8px}
#topPanel .center{position:absolute;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:18px;font-weight:900;color:#ffd166;text-shadow:0 0 15px rgba(255,209,102,0.4);letter-spacing:2px}
#topPanel .right{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:#c0b090}
#topPanel .right span{color:#ffd166;font-weight:800;text-shadow:0 0 10px rgba(255,209,102,0.3)}

/* --- XP BAR (YENİ STİL) --- */
#xpBarContainer{position:fixed;top:50px;left:0;right:0;height:8px;background:rgba(0,0,0,0.8);z-index:20;border-bottom:1px solid rgba(208,160,64,0.2)}
#xpFill{height:100%;width:0%;background:linear-gradient(90deg,#5a2a8a,#a060d0,#d0a0ff);transition:width 0.2s linear;box-shadow:0 0 15px rgba(160,96,208,0.6)}

/* --- CAN BAR (YENİ STİL) --- */
#hpBarContainer{position:fixed;top:58px;left:12px;width:180px;height:14px;background:rgba(0,0,0,0.8);z-index:20;border:1px solid rgba(200,50,50,0.4);border-radius:4px;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,0.5)}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#5a0808,#c03030,#ff6060);transition:width 0.15s linear;box-shadow:0 0 10px rgba(192,48,48,0.6)}
#hpText{position:absolute;top:58px;left:200px;font-size:11px;font-weight:800;color:#c0b090;z-index:20;text-shadow:0 0 5px #000}

/* --- SİLAH İKONLARI (YENİ) --- */
#weaponIcons{position:fixed;top:78px;left:12px;display:flex;gap:6px;z-index:20}
.weaponIcon{width:32px;height:32px;background:rgba(20,15,10,0.9);border:1px solid rgba(160,140,100,0.3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;box-shadow:0 0 8px rgba(0,0,0,0.5)}
.weaponIcon.evolved{border-color:#ffd166;box-shadow:0 0 12px rgba(255,209,102,0.4)}
.weaponIcon .lvl{position:absolute;bottom:-2px;right:-2px;font-size:9px;font-weight:900;color:#ffd166;background:#000;padding:0 3px;border-radius:3px;border:1px solid #ffd166}

/* --- BOSS BAR --- */
#bossBar{position:fixed;top:95px;left:50%;transform:translateX(-50%);width:min(320px,70vw);height:14px;background:rgba(0,0,0,0.85);border:1px solid #8a2020;border-radius:8px;overflow:hidden;display:none;box-shadow:0 0 20px rgba(138,32,32,0.5);z-index:20}
#bossBarFill{height:100%;background:linear-gradient(90deg,#8a2020,#d04040,#4a1a5a);transition:width 0.1s linear;box-shadow:0 0 15px rgba(208,64,64,0.8)}
#bossName{position:fixed;top:80px;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:12px;font-weight:900;color:#ff6060;letter-spacing:3px;text-shadow:0 0 15px #ff2020;display:none;z-index:20}

/* --- DİĞER UI ÖĞELERİ --- */
#comboBadge{position:fixed;top:130px;left:50%;transform:translateX(-50%) scale(0);background:linear-gradient(135deg,#8a3010,#ffb020);color:#0a0a14;padding:8px 24px;border-radius:30px;font-size:16px;font-weight:900;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 0 30px rgba(255,176,32,0.6);letter-spacing:1px;z-index:20}
#comboBadge.show{transform:translateX(-50%) scale(1)}
#milestone{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.5);font-family:'Cinzel',serif;font-size:48px;font-weight:900;color:#ffd166;letter-spacing:6px;text-shadow:0 0 30px #ffb020, 0 0 60px #8a3010, 0 4px 20px #000;transition:all 0.6s cubic-bezier(0.34,1.56,0.64,1);opacity:0;pointer-events:none;z-index:30}
#milestone.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#toast{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%) translateY(-30px);background:rgba(15,10,8,0.95);border:1px solid #ffd166;border-radius:14px;padding:14px 24px;font-size:15px;font-weight:800;color:#ffd166;text-align:center;opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;max-width:80vw;box-shadow:0 0 30px rgba(255,209,102,0.2);backdrop-filter:blur(8px);z-index:30}
#toast.show{opacity:1;transform:translate(-50%,-50%) translateY(0)}
#toast .sub{font-size:12px;color:rgba(200,180,140,0.8);margin-top:4px;font-weight:600}
#waveBanner{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%) scale(0.3);font-family:'Cinzel',serif;font-size:28px;font-weight:900;color:#ff6060;letter-spacing:4px;text-shadow:0 0 30px #ff2020, 0 4px 20px #000;transition:all 0.6s cubic-bezier(0.34,1.56,0.64,1);opacity:0;pointer-events:none;text-align:center;line-height:1.4;z-index:30}
#waveBanner.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#waveBanner .sub{font-size:15px;color:#c0b090;letter-spacing:2px;margin-top:8px;font-family:'Rajdhani',sans-serif}

/* --- EKRANLAR --- */
.screen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,3,5,0.92);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;pointer-events:auto;overflow-y:auto;backdrop-filter:blur(8px)}
#levelUpScreen h1{font-family:'Cinzel',serif;font-size:32px;color:#ffd166;letter-spacing:3px;margin-bottom:12px;text-shadow:0 0 30px rgba(255,209,102,0.5)}
.upgradeCard{width:min(340px,90vw);padding:16px 20px;background:linear-gradient(135deg,rgba(60,40,80,0.8),rgba(40,20,50,0.6));border:1px solid rgba(160,100,200,0.4);border-radius:14px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.upgradeCard:hover{transform:translateY(-2px);border-color:#ffd166;box-shadow:0 0 25px rgba(255,209,102,0.2)}
.upgradeCard:active{transform:scale(0.97)}
.upgradeCard .icon{font-size:30px;width:48px;text-align:center;filter:drop-shadow(0 0 8px rgba(255,209,102,0.5))}
.upgradeCard .info{flex:1}
.upgradeCard .name{font-size:16px;font-weight:800;color:#ffd166;font-family:'Cinzel',serif;letter-spacing:1px}
.upgradeCard .desc{font-size:12px;color:rgba(200,180,140,0.8);margin-top:3px;font-weight:600}
.upgradeCard .lvl{font-size:11px;color:#a060d0;font-weight:800;margin-top:4px;letter-spacing:1px}
#startScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,#1a0808 0%,#050205 100%);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;pointer-events:auto;overflow-y:auto}
#startScreen h1{font-family:'Cinzel',serif;font-size:38px;font-weight:900;letter-spacing:6px;text-align:center;background:linear-gradient(135deg,#ff6060,#ffd166);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 30px rgba(255,96,96,0.4));margin-bottom:4px}
#startScreen .sub{font-size:13px;color:rgba(160,140,100,0.6);margin-top:-8px;letter-spacing:4px;font-weight:600}
.sectionTitle{font-family:'Cinzel',serif;font-size:13px;font-weight:800;color:rgba(255,209,102,0.7);letter-spacing:3px;margin-top:10px;margin-bottom:4px;text-shadow:0 0 15px rgba(255,209,102,0.2)}
.charGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:min(380px,92vw)}
.charCard{padding:10px 6px;background:rgba(30,20,15,0.7);border:1px solid rgba(100,80,60,0.3);border-radius:12px;cursor:pointer;text-align:center;transition:all 0.25s;backdrop-filter:blur(4px)}
.charCard:hover{border-color:rgba(255,209,102,0.5);transform:translateY(-2px)}
.charCard.selected{border-color:#ffd166;background:rgba(255,209,102,0.15);box-shadow:0 0 20px rgba(255,209,102,0.3);transform:translateY(-2px)}
.charCard:active{transform:scale(0.96)}
.charCard .emoji{font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}
.charCard .name{font-size:12px;font-weight:800;margin-top:4px;color:#e0c080;font-family:'Cinzel',serif;letter-spacing:0.5px}
.charCard .wep{font-size:9px;color:rgba(160,140,100,0.7);margin-top:2px;font-weight:600}
.mapGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:min(380px,92vw)}
.mapCard{padding:8px;background:rgba(30,20,15,0.7);border:1px solid rgba(100,80,60,0.3);border-radius:12px;cursor:pointer;text-align:center;position:relative;overflow:hidden;transition:all 0.25s;backdrop-filter:blur(4px)}
.mapCard:hover{border-color:rgba(255,209,102,0.5);transform:translateY(-2px)}
.mapCard .mapPreview{width:100%;height:44px;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-size:22px;filter:brightness(0.8);box-shadow:inset 0 0 20px rgba(0,0,0,0.6)}
.mapCard.selected{border-color:#ffd166;background:rgba(255,209,102,0.15);box-shadow:0 0 20px rgba(255,209,102,0.3);transform:translateY(-2px)}
.mapCard.locked{opacity:0.5;cursor:not-allowed;background:rgba(0,0,0,0.5);filter:grayscale(0.8)}
.mapCard .name{font-size:11px;font-weight:800;margin-top:2px;color:#e0c080;font-family:'Cinzel',serif;letter-spacing:0.5px}
.mapCard .lock{font-size:9px;color:#ff6060;margin-top:3px;line-height:1.3;font-weight:700}
.mapCard .lockIcon{position:absolute;top:6px;right:8px;font-size:16px;z-index:2;filter:drop-shadow(0 0 5px rgba(255,96,96,0.8))}
.goldBox{background:linear-gradient(135deg,rgba(255,209,102,0.15),rgba(255,176,32,0.05));border:1px solid rgba(255,209,102,0.4);border-radius:12px;padding:8px 20px;font-size:15px;font-weight:800;color:#ffd166;box-shadow:0 0 20px rgba(255,209,102,0.15);backdrop-filter:blur(4px);letter-spacing:1px}
#startScreen button{padding:14px 40px;font-family:'Cinzel',serif;font-size:16px;font-weight:900;color:#0a0508;background:linear-gradient(135deg,#ffd166,#ffb020);border:none;border-radius:14px;cursor:pointer;box-shadow:0 0 30px rgba(255,176,32,0.4), 0 8px 24px rgba(0,0,0,0.5);pointer-events:auto;margin-top:8px;letter-spacing:2px;transition:all 0.25s;position:relative;overflow:hidden}
#startScreen button:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(255,176,32,0.6), 0 12px 30px rgba(0,0,0,0.6)}
#startScreen button:active{transform:scale(0.97)}
#startScreen button.sec{background:rgba(30,20,15,0.8);color:#c0b090;box-shadow:none;font-size:13px;padding:10px 24px;font-family:'Rajdhani',sans-serif;font-weight:700;border:1px solid rgba(160,140,100,0.3);letter-spacing:1px}
#startScreen button.sec:hover{border-color:#ffd166;color:#ffd166;background:rgba(255,209,102,0.1)}
#lifetimeStats{display:flex;gap:16px;font-size:12px;color:rgba(160,140,100,0.7);margin-top:0;font-weight:600;background:rgba(0,0,0,0.3);padding:6px 16px;border-radius:20px;border:1px solid rgba(160,140,100,0.1)}
#lifetimeStats span{color:#ffd166;font-weight:800}
#gameOverScreen h1{font-family:'Cinzel',serif;font-size:42px;color:#ff4040;letter-spacing:6px;margin-bottom:12px;text-shadow:0 0 40px rgba(255,64,64,0.6)}
#gameOverScreen .stat{font-size:15px;color:rgba(200,180,140,0.8);font-weight:600}
#gameOverScreen .stat b{color:#ffd166;font-size:20px;font-family:'Cinzel',serif}
#gameOverScreen .goldEarned{font-size:18px;color:#ffd166;font-weight:800;margin-top:10px;text-shadow:0 0 15px rgba(255,209,102,0.4)}
#gameOverScreen button{margin-top:14px;padding:14px 40px;font-family:'Cinzel',serif;font-size:16px;font-weight:900;color:#0a0508;background:linear-gradient(135deg,#ffd166,#ffb020);border:none;border-radius:14px;cursor:pointer;box-shadow:0 0 30px rgba(255,176,32,0.4);transition:all 0.25s;letter-spacing:1px}
#gameOverScreen button:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(255,176,32,0.6)}
#gameOverScreen button.sec{background:rgba(30,20,15,0.8);color:#c0b090;box-shadow:none;font-size:13px;padding:10px 24px;font-family:'Rajdhani',sans-serif;font-weight:700;border:1px solid rgba(160,140,100,0.3)}
#gameOverScreen button.sec:hover{border-color:#ffd166;color:#ffd166}
#metaScreen h1{font-family:'Cinzel',serif;font-size:28px;color:#ffd166;margin-bottom:8px;text-shadow:0 0 30px rgba(255,209,102,0.4);letter-spacing:2px}
#metaScreen .goldShow{font-size:18px;color:#ffd166;font-weight:800;margin-bottom:12px;text-shadow:0 0 15px rgba(255,209,102,0.4)}
.metaRow{width:min(360px,92vw);padding:12px 16px;background:rgba(30,20,15,0.7);border:1px solid rgba(100,80,60,0.3);border-radius:12px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:6px;transition:all 0.2s;backdrop-filter:blur(4px)}
.metaRow:hover{border-color:rgba(255,209,102,0.5);transform:translateX(4px)}
.metaRow.disabled{opacity:0.35;cursor:not-allowed}
.metaRow .icon{font-size:24px;width:36px;text-align:center;filter:drop-shadow(0 0 6px rgba(255,209,102,0.3))}
.metaRow .info{flex:1}
.metaRow .name{font-size:14px;font-weight:800;color:#e0c080;font-family:'Cinzel',serif;letter-spacing:0.5px}
.metaRow .desc{font-size:11px;color:rgba(160,140,100,0.6);margin-top:3px;font-weight:600}
.metaRow .price{font-size:14px;color:#ffd166;font-weight:800;background:rgba(255,209,102,0.1);padding:4px 10px;border-radius:8px;border:1px solid rgba(255,209,102,0.2)}
#metaScreen button{margin-top:16px;padding:12px 36px;font-family:'Cinzel',serif;font-size:15px;font-weight:900;color:#0a0508;background:linear-gradient(135deg,#ffd166,#ffb020);border:none;border-radius:14px;cursor:pointer;box-shadow:0 0 30px rgba(255,176,32,0.4);transition:all 0.25s;letter-spacing:1px}
#metaScreen button:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(255,176,32,0.6)}
.statsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(360px,92vw);margin-top:12px}
.statItem{background:rgba(30,20,15,0.7);padding:10px;border-radius:10px;font-size:11px;color:rgba(160,140,100,0.7);font-weight:600;border:1px solid rgba(100,80,60,0.2);backdrop-filter:blur(4px)}
.statItem b{display:block;font-size:18px;color:#ffd166;margin-top:4px;font-family:'Cinzel',serif}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- YENİ ÜST PANEL -->
<div id="topPanel">
<div class="left">
<div class="weaponIcon" id="wIcon0">🗡️</div>
<div class="weaponIcon" id="wIcon1">✨</div>
<div class="weaponIcon" id="wIcon2">✨</div>
<div class="weaponIcon" id="wIcon3">✨</div>
<div class="weaponIcon" id="wIcon4">✨</div>
</div>
<div class="center" id="timeDisplay">00:00</div>
<div class="right">
<div>💰 <span id="goldDisplay">0</span></div>
<div>💀 <span id="killsDisplay">0</span></div>
</div>
</div>

<!-- YENİ XP BAR -->
<div id="xpBarContainer"><div id="xpFill"></div></div>

<!-- YENİ CAN BAR -->
<div id="hpBarContainer"><div id="hpFill"></div></div>
<div id="hpText">100 / 100</div>

<!-- BOSS BAR -->
<div id="bossName">BOSS</div>
<div id="bossBar"><div id="bossBarFill" style="width:100%"></div></div>

<!-- DİĞER UI -->
<div id="comboBadge"></div>
<div id="milestone"></div>
<div id="waveBanner"></div>
<div id="toast"></div>

<div id="startScreen">
<h1>NIGHTFALL</h1>
<div class="sub">SURVIVORS-LIKE</div>
<div class="goldBox">💰 <span id="startGold">0</span> Altın</div>
<div id="lifetimeStats">
💀 Toplam Kill: <span id="lifetimeKills">0</span> · 👑 Boss: <span id="lifetimeBosses">0</span>
</div>
<div class="sectionTitle">KARAKTER</div>
<div class="charGrid" id="charGrid"></div>
<div class="sectionTitle">HARİTA</div>
<div class="mapGrid" id="mapGrid"></div>
<button id="btnStart">OYUNA BAŞLA</button>
<button class="sec" id="btnMeta">⚙️ KALICI YÜKSELTMELER</button>
</div>

<div class="screen" id="levelUpScreen">
<h1>LEVEL UP!</h1>
<div id="upgradeList"></div>
</div>

<div class="screen" id="metaScreen">
<h1>KALICI YÜKSELTMELER</h1>
<div class="goldShow">💰 <span id="metaGold">0</span> Altın</div>
<div id="metaList"></div>
<button id="btnCloseMeta">GERİ DÖN</button>
</div>

<div class="screen" id="gameOverScreen">
<h1>ÖLDÜN</h1>
<div class="stat">Hayatta kaldın: <b id="finalTime">00:00</b></div>
<div class="stat">Öldürdüğün: <b id="finalKills">0</b></div>
<div class="stat">Seviye: <b id="finalLevel">1</b></div>
<div class="goldEarned">💰 Kazandığın: <span id="goldEarned">0</span> Altın</div>
<div class="statsGrid">
<div class="statItem">Toplam Hasar<b id="statDamage">0</b></div>
<div class="statItem">Kritik Vuruş<b id="statCrit">0</b></div>
<div class="statItem">Toplanan Gem<b id="statGems">0</b></div>
<div class="statItem">Boss Kesilen<b id="statBosses">0</b></div>
</div>
<button id="btnRestart">TEKRAR OYNA</button>
<button class="sec" id="btnBackToMenu">ANA MENÜ</button>
</div>

<script>
(function(){
'use strict';

window.onerror = function(msg, url, line){
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;z-index:999999;padding:10px;font-size:11px;font-family:monospace;';
  d.textContent = 'HATA: ' + msg + ' @ satır ' + line;
  document.body.appendChild(d);
};

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W=0, H=0, DPR=1;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });

var SAVE_KEY = 'nightfall_save_v4';
var meta = { gold:0, upgrades:{hp:0,damage:0,speed:0,cooldown:0,crit:0,regen:0}, lifetimeKills:0, lifetimeBosses:0, lifetimeGoldSpent:0 };
try {
  var raw = localStorage.getItem(SAVE_KEY);
  if (raw){
    var p = JSON.parse(raw);
    if (p.gold !== undefined) meta.gold = p.gold;
    if (p.upgrades) for (var k in meta.upgrades) if (p.upgrades[k] !== undefined) meta.upgrades[k] = p.upgrades[k];
    if (p.lifetimeKills !== undefined) meta.lifetimeKills = p.lifetimeKills;
    if (p.lifetimeBosses !== undefined) meta.lifetimeBosses = p.lifetimeBosses;
    if (p.lifetimeGoldSpent !== undefined) meta.lifetimeGoldSpent = p.lifetimeGoldSpent;
  }
} catch(e){}
function saveMeta(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch(e){} }

var MAPS = [

function drawHero(x, y, type, facing, frame){
  var P = COLORS[type] || COLORS.warrior;
  ctx.save();
  ctx.translate(x, y);
  if (facing < 0) ctx.scale(-1, 1);
  var bob = (frame===1||frame===3)?-2:0;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 18, 12, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = P.head;
  ctx.fillRect(-6, 4+bob, 5, 14);
  ctx.fillRect(1, 4+bob, 5, 14);
  ctx.fillStyle = P.body;
  ctx.fillRect(-9, -12+bob, 18, 18);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(-9, -12+bob, 18, 3);
  ctx.fillStyle = P.body;
  ctx.fillRect(-13, -10+bob, 4, 12);
  ctx.fillRect(9, -10+bob, 4, 12);
  ctx.fillStyle = '#8a7a60';
  ctx.fillRect(-7, -24+bob, 14, 12);
  ctx.fillStyle = P.head;
  ctx.fillRect(-8, -26+bob, 16, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(-8, -26+bob, 16, 2);
  ctx.fillStyle = '#000';
  ctx.fillRect(-4, -19+bob, 2, 2);
  ctx.fillRect(2, -19+bob, 2, 2);
  ctx.fillStyle = P.weapon;
  if (type === 'archer'){
    ctx.strokeStyle = P.weapon; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(16, -6+bob, 10, -Math.PI/2, Math.PI/2); ctx.stroke();
  } else if (type === 'mage' || type === 'bloodmage'){
    ctx.fillRect(12, -20+bob, 3, 22);
    ctx.fillStyle = type === 'bloodmage' ? '#d04040' : '#a06ac0';
    ctx.beginPath(); ctx.arc(13.5, -22+bob, 5, 0, Math.PI*2); ctx.fill();
    ctx.shadowColor = type === 'bloodmage' ? '#d04040' : '#a06ac0';
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(13.5, -22+bob, 3, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (type === 'warrior' || type === 'knight'){
    ctx.fillRect(12, -18+bob, 3, 18);
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(10, -2+bob, 7, 3);
  } else {
    ctx.fillRect(12, 0+bob, 3, 12);
  }
  ctx.restore();
}

function drawEnemy(e, camX, camY){
  var x = e.x - camX, y = e.y - camY;
  var P = COLORS[e.type] || COLORS.zombie;
  var r = e.radius;
  var bob = (e.frame % 2 === 0) ? 0 : -2;
  ctx.save();
  ctx.translate(x, y);
  if (e.isBoss){
    var auraGrad = ctx.createRadialGradient(0,0,r*0.5,0,0,r+25);
    auraGrad.addColorStop(0,'rgba(255,50,50,0.4)');
    auraGrad.addColorStop(1,'rgba(255,50,50,0)');
    ctx.fillStyle = auraGrad;
    ctx.beginPath(); ctx.arc(0, 0, r+25, 0, Math.PI*2); ctx.fill();
  } else if (e.isElite){
    var auraGrad2 = ctx.createRadialGradient(0,0,r*0.5,0,0,r+15);
    auraGrad2.addColorStop(0,'rgba(255,160,50,0.35)');
    auraGrad2.addColorStop(1,'rgba(255,160,50,0)');
    ctx.fillStyle = auraGrad2;
    ctx.beginPath(); ctx.arc(0, 0, r+15, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, r-2, r*0.9, r*0.3, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = P.body;
  ctx.beginPath(); ctx.arc(0, 0+bob, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = P.head;
  ctx.beginPath(); ctx.arc(0, -r*0.3+bob, r*0.7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = P.eye || '#000';
  ctx.beginPath();
  ctx.arc(-r*0.3, -r*0.2+bob, r*0.18, 0, Math.PI*2);
  ctx.arc(r*0.3, -r*0.2+bob, r*0.18, 0, Math.PI*2);
  ctx.fill();
  if (P.eyeGlow){
    ctx.fillStyle = P.eyeGlow;
    ctx.shadowColor = P.eyeGlow;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(-r*0.3, -r*0.2+bob, r*0.08, 0, Math.PI*2);
    ctx.arc(r*0.3, -r*0.2+bob, r*0.08, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  if (e.type === 'skeleton' || e.type === 'iceSkel' || e.type === 'skullDemon'){
    ctx.strokeStyle = P.extra; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r*0.8, 0+bob); ctx.lineTo(r*0.8, 0+bob); ctx.stroke();
  }
  if (e.type === 'skullDemon' || e.type === 'flameImp' || e.type === 'emberDemon'){
    ctx.fillStyle = P.extra;
    ctx.beginPath();
    ctx.moveTo(-r*0.5, -r*0.8+bob); ctx.lineTo(-r*0.9, -r*1.4+bob); ctx.lineTo(-r*0.3, -r*0.9+bob);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r*0.5, -r*0.8+bob); ctx.lineTo(r*0.9, -r*1.4+bob); ctx.lineTo(r*0.3, -r*0.9+bob);
    ctx.closePath(); ctx.fill();
  }
  if (e.type === 'bat'){
    ctx.fillStyle = P.extra;
    ctx.beginPath();
    ctx.moveTo(-r*0.5, 0+bob); ctx.lineTo(-r*1.8, -r*0.5+bob); ctx.lineTo(-r*0.8, r*0.3+bob);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r*0.5, 0+bob); ctx.lineTo(r*1.8, -r*0.5+bob); ctx.lineTo(r*0.8, r*0.3+bob);
    ctx.closePath(); ctx.fill();
  }
  if (e.type === 'scorpion'){
    ctx.strokeStyle = P.extra; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(r*0.7, 0+bob);
    ctx.quadraticCurveTo(r*1.5, -r*0.5+bob, r*1.2, -r*1.2+bob);
    ctx.stroke();
  }
  if (e.type === 'hellHound' || e.type === 'rotwolf' || e.type === 'snowWolf'){
    ctx.fillStyle = P.extra;
    ctx.beginPath();
    ctx.moveTo(-r*0.7, -r*0.5+bob); ctx.lineTo(-r*0.5, -r*1.2+bob); ctx.lineTo(-r*0.2, -r*0.7+bob);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r*0.7, -r*0.5+bob); ctx.lineTo(r*0.5, -r*1.2+bob); ctx.lineTo(r*0.2, -r*0.7+bob);
    ctx.closePath(); ctx.fill();
  }
  if (e.isBoss){
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(-r*0.8, -r*1.1); ctx.lineTo(-r*0.5, -r*1.5); ctx.lineTo(-r*0.2, -r*1.1);
    ctx.lineTo(0, -r*1.5); ctx.lineTo(r*0.2, -r*1.1); ctx.lineTo(r*0.5, -r*1.5);
    ctx.lineTo(r*0.8, -r*1.1); ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  } else if (e.isElite){
    ctx.fillStyle = '#ff9f68';
    ctx.beginPath();
    ctx.moveTo(-r*0.5, -r*0.9); ctx.lineTo(0, -r*1.3); ctx.lineTo(r*0.5, -r*0.9);
    ctx.closePath(); ctx.fill();
  }
  if (e.hitFlash > 0){
    ctx.fillStyle = 'rgba(255,220,220,' + Math.min(0.8, e.hitFlash*4) + ')';
    ctx.beginPath(); ctx.arc(0, 0+bob, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  if (e.isBoss || e.isElite || e.hp < e.maxHp){
    var bw = r*2.5, bh = 3, by = y - r - 12;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(x-bw/2, by, bw, bh);
    ctx.fillStyle = e.isBoss ? '#ff4040' : e.isElite ? '#ff9f68' : '#c03030';
    if (e.isBoss){ ctx.shadowColor = '#ff4040'; ctx.shadowBlur = 6; }
    ctx.fillRect(x-bw/2, by, bw*(e.hp/e.maxHp), bh);
    ctx.shadowBlur = 0;
  }
}

var audioCtx = null;
function initAudio(){
  if (!audioCtx){
    try { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended'){ try { audioCtx.resume(); } catch(e){} }
}
function sfx(freq, dur, type, vol, freqEnd){
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    var t0 = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  } catch(e){}
}

var musicTimer = null, musicStep = 0;
function startMusic(mode){
  if (!audioCtx || musicTimer) return;
  var chords, bass, tempo;
  if (mode === 'game'){
    chords = [[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66],[164.81,207.65,246.94]];
    bass = [110,87.31,98,82.41];
    tempo = 400;
  } else {
    chords = [[261.63,329.63,392],[220,261.63,329.63],[246.94,293.66,349.23],[196,246.94,293.66]];
    bass = [130.81,110,123.47,98];
    tempo = 500;
  }
  musicTimer = setInterval(function(){
    if (!audioCtx || audioCtx.state !== 'running') return;
    var bar = Math.floor(musicStep / 4) % 4;
    var step = musicStep % 4;
    var chord = chords[bar];
    var b = bass[bar];
    if (step === 0){
      sfx(b, 1.8, 'sine', mode === 'game' ? 0.045 : 0.03, null);
      for (var i=0;i<chord.length;i++) sfx(chord[i], 2.5, 'sine', mode === 'game' ? 0.012 : 0.008, null);

    if (step === 2) sfx(chord[0]*2, 0.5, 'triangle', 0.015, null);
    if (step === 3 && mode === 'game') sfx(chord[1]*2, 0.3, 'sine', 0.01, null);
    musicStep++;
  }, tempo);
}
function stopMusic(){ if (musicTimer){ clearInterval(musicTimer); musicTimer = null; } }

function findNearestEnemy(x, y, maxRange){
  var best = null, bestD = maxRange * maxRange;
  for (var i=0;i<enemies.length;i++){
    var e = enemies[i];
    var d = (x-e.x)*(x-e.x)+(y-e.y)*(y-e.y);
    if (d < bestD){ bestD = d; best = e; }
  }
  return best;
}
function spawnFloater(x, y, text, color, big){

}

    if (all[i] !== weaponKey) weapons[all[i]] = { level:0, timer:0, evolved:false };

}

function getEnemyStats(type, baseHp, baseSpeed){
  var stats = {
    zombie:{ hpMult:1.4, speedMult:0.8, dmgMult:1.0, radius:13 },
    skeleton:{ hpMult:0.7, speedMult:1.3, dmgMult:1.15, radius:12 },
    ghost:{ hpMult:0.9, speedMult:1.0, dmgMult:1.0, radius:13 },
    rotwolf:{ hpMult:0.8, speedMult:1.4, dmgMult:1.1, radius:12 },
    treant:{ hpMult:2.2, speedMult:0.6, dmgMult:1.3, radius:18 },
    vine:{ hpMult:1.2, speedMult:0.9, dmgMult:1.1, radius:13 },
    mummy:{ hpMult:1.5, speedMult:0.9, dmgMult:1.0, radius:14 },
    scorpion:{ hpMult:0.6, speedMult:1.6, dmgMult:1.0, radius:11 },
    sandDemon:{ hpMult:1.8, speedMult:0.8, dmgMult:1.2, radius:15 },
    iceSkel:{ hpMult:1.0, speedMult:1.1, dmgMult:1.1, radius:13 },
    snowWolf:{ hpMult:0.8, speedMult:1.4, dmgMult:1.1, radius:12 },
    frostGiant:{ hpMult:2.5, speedMult:0.55, dmgMult:1.4, radius:20 },
    skullDemon:{ hpMult:0.9, speedMult:1.2, dmgMult:1.15, radius:13 },
    bat:{ hpMult:0.5, speedMult:1.8, dmgMult:0.9, radius:10 },
    cryptWorm:{ hpMult:1.6, speedMult:0.85, dmgMult:1.1, radius:14 },
    flameImp:{ hpMult:1.0, speedMult:1.1, dmgMult:1.1, radius:13 },
    emberDemon:{ hpMult:2.0, speedMult:0.7, dmgMult:1.35, radius:18 },
    hellHound:{ hpMult:0.7, speedMult:1.5, dmgMult:1.1, radius:12 }
  };
  var s = stats[type] || { hpMult:1, speedMult:1, dmgMult:1, radius:13 };
  return { hp: baseHp * s.hpMult, speed: baseSpeed * s.speedMult, dmgMult: s.dmgMult, radius: s.radius };
}

function updateWeapons(dt){
  var dmgMult = player.damageMult * (1 + passives.damage.level * 0.15) * (comboActive > 0 ? 1.5 : 1);
  var cdMult = player.cooldownMult * (1 - passives.cooldown.level * 0.12);
  var areaMult = 1 + passives.area.level * 0.2;

  var w = weapons.knife;
  if (w && w.level > 0){
    w.timer -= dt*1000;
    if (w.timer <= 0){
      var target = findNearestEnemy(player.x, player.y, 250);
      if (target){
        w.timer = Math.max(80, (w.evolved ? 120 : 450) * cdMult);
        var baseDmg = (w.evolved ? 18 : 12) * (1+(w.level-1)*0.25) * dmgMult;
        var count = w.evolved ? 8 : Math.min(4, w.level);
        var spread = w.evolved ? 1.2 : 0.15;
        var baseAng = Math.atan2(target.y-player.y, target.x-player.x);
        for (var i=0;i<count;i++){
          var ang = baseAng + (i-(count-1)/2)*spread;
          bullets.push({ x:player.x, y:player.y, vx:Math.cos(ang)*600, vy:Math.sin(ang)*600, dmg:baseDmg, radius:6, life:0.5, color:'#e0e0ff', type:'knife', pierce:w.evolved?2:0, hitSet:{} });
        }
      }
    }
  }

  w = weapons.spear;
  if (w && w.level > 0){
    w.timer -= dt*1000;
    if (w.timer <= 0){
      var t2 = findNearestEnemy(player.x, player.y, 450);
      if (t2){
        w.timer = Math.max(300, (w.evolved ? 500 : 900) * cdMult);
        var a2 = Math.atan2(t2.y-player.y, t2.x-player.x);
        bullets.push({ x:player.x, y:player.y, vx:Math.cos(a2)*700, vy:Math.sin(a2)*700, dmg:(w.evolved ? 55 : 25) * (1+(w.level-1)*0.3) * dmgMult, radius:w.evolved?16:8, life:w.evolved?1.8:1.2, color:'#ffd166', type:'spear', pierce:999, explodeRadius:w.evolved ? 90*areaMult : 0, hitSet:{} });
      }
    }
  }

  w = weapons.fireball;
  if (w && w.level > 0){
    w.timer -= dt*1000;
    if (w.timer <= 0){
      var t3 = findNearestEnemy(player.x, player.y, 350);
      if (t3){
        w.timer = Math.max(400, (w.evolved ? 900 : 1400) * cdMult);
        var a3 = Math.atan2(t3.y-player.y, t3.x-player.x);
        bullets.push({ x:player.x, y:player.y, vx:Math.cos(a3)*380, vy:Math.sin(a3)*380, dmg:(w.evolved ? 50 : 30) * (1+(w.level-1)*0.3) * dmgMult, radius:w.evolved?18:12, life:1.6, color:'#ff6020', type:'fireball', explodeRadius:(w.evolved ? 110 : 60) * areaMult, hitSet:{} });
      }
    }
  }

  w = weapons.lightning;
  if (w && w.level > 0){
    w.timer -= dt*1000;
    if (w.timer <= 0){
      w.timer = Math.max(600, (w.evolved ? 1400 : 2200) * cdMult);
      var maxT = w.evolved ? 6 : w.level + 1;
      var targets = enemies.slice().sort(function(a,b){
        return (player.x-a.x)*(player.x-a.x)+(player.y-a.y)*(player.y-a.y) - (player.x-b.x)*(player.x-b.x)-(player.y-b.y)*(player.y-b.y);
      }).slice(0, maxT);
      for (var t=0;t<targets.length;t++){
        var en = targets[t];
        applyDamage(en, (w.evolved ? 70 : 40) * (1+(w.level-1)*0.3) * dmgMult);
        particles.push({ type:'lightning', x1:player.x, y1:player.y, x2:en.x, y2:en.y, life:0.15, maxLife:0.15 });
      }
    }
  }

  w = weapons.boomerang;
  if (w && w.level > 0){
    w.timer -= dt*1000;
    if (w.timer <= 0){
      w.timer = Math.max(400, (w.evolved ? 700 : 1200) * cdMult);
      var t4 = findNearestEnemy(player.x, player.y, 400);
      var a4 = t4 ? Math.atan2(t4.y-player.y, t4.x-player.x) : Math.random() * Math.PI * 2;
      var bCount = w.evolved ? 4 : (1 + w.level);
      for (var i=0;i<bCount;i++){
        var bAng = a4 + i * (Math.PI*2/bCount);
        bullets.push({ x:player.x, y:player.y, vx:Math.cos(bAng)*350, vy:Math.sin(bAng)*350, dmg:(w.evolved ? 40 : 22) * (1+(w.level-1)*0.3) * dmgMult, radius:w.evolved?14:10, life:2.4, color:'#ffd166', type:'boomerang', pierce:999, hitSet:{}, returnHitSet:{}, boomerangPhase:0 });
      }
    }
  }

  w = weapons.poison;
  if (w && w.level > 0){
    w.timer -= dt*1000;
    if (w.timer <= 0){
      w.timer = Math.max(800, (w.evolved ? 1600 : 2500) * cdMult);
      var pCount = w.evolved ? 3 : (1 + w.level);
      for (var i=0;i<pCount;i++){
        var pAng = Math.random() * Math.PI * 2;
        var pDist = 60 + Math.random() * (w.evolved ? 200 : 120);
        particles.push({ type:'poison', x:player.x + Math.cos(pAng) * pDist, y:player.y + Math.sin(pAng) * pDist, radius:(w.evolved ? 60 : 35) * areaMult, dmg:(w.evolved ? 16 : 8) * (1+(w.level-1)*0.4) * dmgMult, life:5, maxLife:5, tickTimer:0, hitSet:{} });
      }
    }
  }

  w = weapons.hammer;
  if (w && w.level > 0){
    w.timer -= dt*1000;
    if (w.timer <= 0){
      var t5 = findNearestEnemy(player.x, player.y, 200);
      if (t5){
        w.timer = Math.max(700, (w.evolved ? 1100 : 1800) * cdMult);
        bullets.push({ x:t5.x, y:t5.y, vx:0, vy:0, dmg:(w.evolved ? 80 : 50) * (1+(w.level-1)*0.4) * dmgMult, radius:w.evolved?80:50, life:0.4, color:'#ffd166', type:'hammer' });
      }
    }
  }

  w = weapons.iceSpear;
  if (w && w.level > 0){
    w.timer -= dt*1000;
    if (w.timer <= 0){
      var t6 = findNearestEnemy(player.x, player.y, 400);
      if (t6){
        w.timer = Math.max(500, (w.evolved ? 800 : 1200) * cdMult);
        var a6 = Math.atan2(t6.y-player.y, t6.x-player.x);
        bullets.push({ x:player.x, y:player.y, vx:Math.cos(a6)*500, vy:Math.sin(a6)*500, dmg:(w.evolved ? 45 : 25) * (1+(w.level-1)*0.3) * dmgMult, radius:w.evolved?14:8, life:1.5, color:'#5fd3c4', type:'iceSpear', pierce:w.evolved?5:2, slow:0.5, hitSet:{} });
      }
    }
  }

  w = weapons.flameSword;
  if (w && w.level > 0){
    w.timer -= dt*1000;
    if (w.timer <= 0){
      w.timer = Math.max(500, (w.evolved ? 900 : 1400) * cdMult);
      var radius = (w.evolved ? 130 : 90) * areaMult;
      var dmg2 = (w.evolved ? 45 : 28) * (1+(w.level-1)*0.3) * dmgMult;
      for (var j=enemies.length-1;j>=0;j--){
        var en = enemies[j];
        var dx = en.x - player.x, dy = en.y - player.y;
        if (dx*dx + dy*dy < radius*radius) applyDamage(en, dmg2);
      }
      particles.push({ type:'flameRing', x:player.x, y:player.y, radius:radius, life:0.3, maxLife:0.3 });
    }
  }
}

function spawnEnemy(){

  if (!types || types.length === 0) types = currentMap.enemyTypes;
  var type = types[Math.floor(Math.random() * types.length)];
  var ang = Math.random()*Math.PI*2;
  var radius = Math.max(W,H)*0.8;
  var x = player.x + Math.cos(ang)*radius;
  var y = player.y + Math.sin(ang)*radius;
  var t = gameTime/1000;
  var isElite = Math.random() < 0.06 && t > 30;
  var baseHp = (20 + t*1.5) * currentMap.enemyMult;
  var baseSpeed = 55 + Math.random()*25 + t*0.3;
  if (currentMap.id === 'frozen') baseSpeed *= 0.85;
  var stats = getEnemyStats(type, baseHp, baseSpeed);
  if (isElite){ stats.hp *= 4; stats.speed *= 0.9; stats.radius *= 1.5; }
  enemies.push({ x:x, y:y, hp:stats.hp, maxHp:stats.hp, speed:stats.speed, radius: stats.radius, type: type, dmgMult: stats.dmgMult, hitFlash:0, isBoss:false, isElite:isElite, xpValue: isElite ? 5 : 1, goldValue: Math.round((isElite ? 8 : 1) * currentMap.goldMult), frame: 0, animTimer: 0, slowUntil: 0 });
}

      for (var i=0;i<3;i++){
        var ang = Math.random()*Math.PI*2;
        enemies.push({ x:activeBoss.x + Math.cos(ang)*60, y:activeBoss.y + Math.sin(ang)*60, hp:30, maxHp:30, speed:80, radius:10, type:'skeleton', dmgMult:1.0, hitFlash:0, isBoss:false, isElite:false, xpValue:1, goldValue:1, frame:0, animTimer:0, slowUntil:0 });

      showToast('💀 Boss ölü çağırdı!', '');

    if (bossMechanicTimer >= 3.5){
      bossMechanicTimer = 0;
      for (var i=0;i<6;i++){
        var ang = Math.random()*Math.PI*2;
        var d = 80 + Math.random()*150;
        particles.push({ type:'root', x:player.x + Math.cos(ang)*d, y:player.y + Math.sin(ang)*d, radius:40, dmg:15, life:0.8, maxLife:0.8, hasHit:false });
      }
      showToast('🌿 Kök saldırısı!', '');
    }
  } else if (m === 'slow'){
    if (bossMechanicTimer >= 5){
      bossMechanicTimer = 0;
      particles.push({ type:'slowzone', x:player.x, y:player.y, radius:150, life:3, maxLife:3 });
      showToast('⏳ Yavaşlatma alanı!', '');
    }
  } else if (m === 'freeze'){
    if (bossMechanicTimer >= 4){
      bossMechanicTimer = 0;
      particles.push({ type:'freeze', x:player.x, y:player.y, radius:100, life:1.5, maxLife:1.5, hasHit:false });
      showToast('❄️ Donma dalgası!', '');
    }
  } else if (m === 'teleport'){
    if (bossMechanicTimer >= 5){
      bossMechanicTimer = 0;
      var ang = Math.random()*Math.PI*2;
      var d = 100 + Math.random()*100;
      activeBoss.x = player.x + Math.cos(ang)*d;
      activeBoss.y = player.y + Math.sin(ang)*d;
      var ang2 = Math.random()*Math.PI*2;
      enemies.push({ x:activeBoss.x + Math.cos(ang2)*40, y:activeBoss.y + Math.sin(ang2)*40, hp:40, maxHp:40, speed:100, radius:11, type:'bat', dmgMult:1.1, hitFlash:0, isBoss:false, isElite:false, xpValue:1, goldValue:1, frame:0, animTimer:0, slowUntil:0 });
      showToast('🌀 Boss teleport!', '');
    }
  } else if (m === 'firering'){
    if (bossMechanicTimer >= 2.5){
      bossMechanicTimer = 0;
      for (var i=0;i<8;i++){
        var ang = (i/8) * Math.PI * 2;
        bullets.push({ x:activeBoss.x, y:activeBoss.y, vx:Math.cos(ang)*250, vy:Math.sin(ang)*250, dmg:12, radius:10, life:2.5, color:'#ff5010', type:'fireball', isEnemyBullet:true, explodeRadius:0, hitSet:{} });
      }
      showToast('🔥 Ateş halkası!', '');
    }
  }
}

function applyDamage(enemy, dmg){
  var crit = false;
  if (player.critChance > 0 && Math.random() < player.critChance){
    dmg *= player.critMult;
    crit = true;
    totalCrits++;
    shake = Math.max(shake, 5);
  }
  enemy.hp -= dmg;
  totalDamage += dmg;
  enemy.hitFlash = 0.12;
  damageNumbers.push({ x:enemy.x+Math.random()*20-10, y:enemy.y-enemy.radius, text:(crit?'💥':'')+Math.round(dmg), color: crit ? '#ff6060' : '#ffd166', life:0.7, maxLife:0.7, vy:-60, big: crit });
  if (crit) Snd.crit(); else if (Math.random() < 0.3) Snd.hit();
  if (enemy.hp <= 0) killEnemy(enemy);
}

function killEnemy(enemy){
  var idx = enemies.indexOf(enemy);
  if (idx === -1) return;
  enemies.splice(idx, 1);
  kills++;
  Snd.kill();
  if (gameTime - lastKillTime < 800) killStreak++; else killStreak = 1;
  lastKillTime = gameTime;
  if (killStreak >= 10){
    comboActive = 5000;
    if (killStreak === 10) showToast('🔥 KILL STREAK!', '5 saniye +%50 hasar!');
    killStreak = 0;
  }
  var gemCount = enemy.isBoss ? 20 : enemy.isElite ? 3 : 1;
  for (var i=0;i<gemCount;i++){
    spawnGem(enemy.x+Math.random()*30-15, enemy.y+Math.random()*30-15, enemy.isBoss ? 3 : enemy.isElite ? 2 : 1);
  }
  if (Math.random() < 0.05 && !enemy.isBoss){
    spawnGem(enemy.x+Math.random()*20-10, enemy.y+Math.random()*20-10, 5);
  }
  goldCollected += enemy.goldValue || 1;
  if (enemy.goldValue >= 8){ Snd.gold(); }
  if (enemy.isBoss){
    spawnChest(enemy.x, enemy.y);
    shake = 20;
    bossesKilled++;
    showToast('👑 BOSS ÖLDÜ!', 'Sandık düştü!');
    Snd.bossDie();
    activeBoss = null;
    document.getElementById('bossBar').style.display = 'none';
    document.getElementById('bossName').style.display = 'none';
  }
  if (enemy.isElite){ shake = 8; }
  for (var p=0;p<8;p++){
    var ang = Math.random()*Math.PI*2;
    var spd = 80+Math.random()*140;
    particles.push({ type:'spark', x:enemy.x, y:enemy.y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:0.5, maxLife:0.5, color:'#c03030', radius:Math.random()*4+2 });
  }
}

function updatePlayer(dt){
  if (input.mag > 0.1){
    var mv = player.speed*input.mag*dt;
    player.x += input.dx*mv;
    player.y += input.dy*mv;
    if (Math.abs(input.dx) > 0.1) player.facing = input.dx > 0 ? 1 : -1;
    playerAnimTimer += dt;
    if (playerAnimTimer > 0.12){ playerAnimTimer = 0; playerAnimFrame = (playerAnimFrame + 1) % 4; }
  } else { playerAnimFrame = 0; playerAnimTimer = 0; }
  if (player.hitFlash > 0) player.hitFlash -= dt;
  if (player.regenRate > 0 && player.hp < player.maxHp){
    player.regenTimer += dt;
    if (player.regenTimer >= 2){
      player.regenTimer = 0;
      player.hp = Math.min(player.maxHp, player.hp + player.regenRate);
    }
  }
  cam.x = player.x; cam.y = player.y;
}

function updateEnemies(dt){
  for (var i=enemies.length-1;i>=0;i--){
    var e = enemies[i];
    var dx = player.x-e.x, dy = player.y-e.y;
    var d = Math.sqrt(dx*dx+dy*dy);
    var speedMult = 1;
    if (e.slowUntil && gameTime < e.slowUntil) speedMult = 0.5;
    for (var sp=0;sp<particles.length;sp++){
      if (particles[sp].type === 'slowzone'){
        var sdx = e.x - particles[sp].x;
        var sdy = e.y - particles[sp].y;
        if (sdx*sdx + sdy*sdy < particles[sp].radius * particles[sp].radius) speedMult = Math.min(speedMult, 0.4);
      }
    }
    if (d > 0.01){ e.x += (dx/d)*e.speed*speedMult*dt; e.y += (dy/d)*e.speed*speedMult*dt; }
    if (e.hitFlash > 0) e.hitFlash -= dt;
    e.animTimer += dt;
    if (e.animTimer > 0.15){ e.animTimer = 0; e.frame = (e.frame + 1) % 4; }
    if (d < player.radius + e.radius && gameTime > player.invulnUntil){
      var baseDmg = e.isBoss ? 25 : e.isElite ? 14 : 8;
      var dmg = baseDmg * (e.dmgMult || 1);
      player.hp -= dmg;
      player.invulnUntil = gameTime + 700;
      player.hitFlash = 0.3;
      shake = Math.max(shake, e.isBoss ? 12 : 6);
      Snd.hurt();
      e.x -= (dx/d)*40; e.y -= (dy/d)*40;
      if (player.hp <= 0){ player.hp = 0; gameOver(); return; }
    }
  }
}

function updateBullets(dt){
  for (var i=bullets.length-1;i>=0;i--){
    var b = bullets[i];
    if (b.type === 'hammer'){
      b.life -= dt;
      if (b.life <= 0){
        for (var j=enemies.length-1;j>=0;j--){
          var e = enemies[j];
          var dx = e.x - b.x, dy = e.y - b.y;
          if (dx*dx + dy*dy < b.radius*b.radius) applyDamage(e, b.dmg);
        }
        bullets.splice(i, 1);
      }
      continue;
    }
    if (b.isEnemyBullet){
      b.x += b.vx*dt; b.y += b.vy*dt;
      b.life -= dt;
      var dxp = player.x - b.x;
      var dyp = player.y - b.y;
      if (dxp*dxp + dyp*dyp < (player.radius + b.radius) * (player.radius + b.radius)){
        if (gameTime > player.invulnUntil){
          player.hp -= b.dmg;
          player.invulnUntil = gameTime + 700;
          player.hitFlash = 0.3;
          shake = Math.max(shake, 6);
          Snd.hurt();
          if (player.hp <= 0){ player.hp = 0; gameOver(); return; }
        }
      }
      if (b.life <= 0) bullets.splice(i, 1);
      continue;
    }
    if (b.type === 'boomerang'){
      b.boomerangPhase += dt;
      if (b.boomerangPhase < 0.7){ b.vx *= 0.96; b.vy *= 0.96; }
      else if (b.boomerangPhase < 1.4){
        var rdx = player.x - b.x;
        var rdy = player.y - b.y;
        var rd = Math.sqrt(rdx*rdx + rdy*rdy) || 1;
        b.vx = (rdx/rd) * 500;
        b.vy = (rdy/rd) * 500;
      }
      if (b.boomerangPhase > 1.4){
        var ddx = player.x - b.x;
        var ddy = player.y - b.y;
        if (ddx*ddx + ddy*ddy < 40*40){ bullets.splice(i, 1); continue; }
      }
    }
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.life -= dt;
    var hit = false;
    for (var j=enemies.length-1;j>=0;j--){
      var e = enemies[j];
      var useSet = (b.type === 'boomerang' && b.boomerangPhase > 0.7) ? b.returnHitSet : b.hitSet;
      if (useSet[e.x+'_'+e.y]) continue;
      var rr = b.radius + e.radius;
      if ((b.x-e.x)*(b.x-e.x)+(b.y-e.y)*(b.y-e.y) < rr*rr){
        applyDamage(e, b.dmg);
        if (b.slow) e.slowUntil = gameTime + 2000;
        useSet[e.x+'_'+e.y] = true;
        if (b.explodeRadius){
          for (var k=enemies.length-1;k>=0;k--){
            var e2 = enemies[k];
            if (e2 === e) continue;
            var key2 = e2.x+'_'+e2.y;
            if (b.hitSet[key2]) continue;
            b.hitSet[key2] = true;
            var er = b.explodeRadius;
            if ((b.x-e2.x)*(b.x-e2.x)+(b.y-e2.y)*(b.y-e2.y) < er*er) applyDamage(e2, b.dmg*0.6);
          }
          for (var p=0;p<14;p++){
            var ang = Math.random()*Math.PI*2;
            var spd = 60+Math.random()*160;
            particles.push({ type:'spark', x:b.x, y:b.y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:0.4, maxLife:0.4, color:'#ff6020', radius:Math.random()*5+2 });
          }
          hit = true; break;
        }
        if (b.pierce) b.pierce--; else { hit = true; break; }
      }
    }
    if (hit || b.life <= 0) bullets.splice(i, 1);
  }
}

function updateGems(dt){
  var magnetRange = 220 + passives.magnet.level * 100;
  var mr2 = magnetRange * magnetRange;
  for (var i=gems.length-1;i>=0;i--){
    var g = gems[i];
    var d2 = (player.x-g.x)*(player.x-g.x)+(player.y-g.y)*(player.y-g.y);
    if (d2 < mr2){
      var d = Math.sqrt(d2) || 1;
      var dirX = (player.x - g.x) / d;
      var dirY = (player.y - g.y) / d;
      var baseSpeed = 550 + passives.magnet.level * 120;
      var closeness = 1 - d / magnetRange;
      var closeBoost = 1 + closeness * 1.5;
      g.vx = dirX * baseSpeed * closeBoost;
      g.vy = dirY * baseSpeed * closeBoost;
    } else { g.vx *= 0.9; g.vy *= 0.9; }
    g.x += g.vx*dt; g.y += g.vy*dt;
    var rr = player.radius + g.radius + 8;
    if (d2 < rr*rr){
      player.xp += g.value;
      gemsCollected += g.value;
      if (Math.random() < 0.15) Snd.gem();
      gems.splice(i, 1);
      if (player.xp >= player.xpNext) levelUp();
    }
  }
}

function updateChests(dt){
  for (var i=chests.length-1;i>=0;i--){
    var c = chests[i];
    c.life -= dt;
    c.animTimer += dt;
    if (c.animTimer > 0.3){ c.animTimer = 0; c.frame = (c.frame + 1) % 2; }
    if (c.life <= 0){ chests.splice(i, 1); continue; }
    var dx = player.x-c.x, dy = player.y-c.y;
    if (dx*dx+dy*dy < 50*50){ openChest(c); chests.splice(i, 1); }
  }
}

function openChest(chest){
  for (var key in weapons){
    var w = weapons[key];
    if (w && w.level >= 3 && !w.evolved && EVOLUTIONS[key]){
      var reqPassive = EVOLUTIONS[key].passive;
      if (passives[reqPassive] && passives[reqPassive].level > 0){
        w.evolved = true;
        w.level = 1;
        showToast('⚡ EVRİM! ⚡', EVOLUTIONS[key].name);
        Snd.evolve();
        shake = 15;
        return;
      }
    }
  }
  var t = chest.chestType;
  if (t === 'heal'){
    var healAmount = Math.round(player.maxHp * 0.3);
    player.hp = Math.min(player.maxHp, player.hp + healAmount);
    spawnFloater(player.x, player.y-40, '+' + healAmount + ' HP', '#5fb35f', true);
    showToast('❤️ İYİLEŞTİRME', '+' + healAmount + ' can');
    Snd.heal(); shake = 5;
  } else if (t === 'xp'){
    var xpAmount = 8 + Math.floor(Math.random() * 8);
    player.xp += xpAmount;
    spawnFloater(player.x, player.y-40, '+' + xpAmount + ' XP', '#5fd3c4', true);
    showToast('⭐ TECRÜBE', '+' + xpAmount + ' XP');
    Snd.levelUp();
    if (player.xp >= player.xpNext) levelUp();
  } else if (t === 'buff'){
    var buffRoll = Math.random();
    if (buffRoll < 0.5){
      player.speed += 60;
      spawnFloater(player.x, player.y-40, '👟 HIZ +60', '#5fd3c4', true);
      showToast('👟 HIZ ARTTI!', 'Kalıcı +60 hareket hızı');
    } else {
      player.damageMult += 0.15;
      spawnFloater(player.x, player.y-40, '💪 HASAR +15%', '#ff6060', true);
      showToast('💪 GÜÇ ARTTI!', 'Kalıcı +15% hasar');
    }
    Snd.evolve(); shake = 8;
  } else if (t === 'legendary'){
    var gold = Math.round((80 + Math.floor(Math.random()*60)) * currentMap.goldMult);
    goldCollected += gold;
    player.hp = player.maxHp;
    player.xp += 15;
    spawnFloater(player.x, player.y-40, '💎 EFSANE!', '#ffd166', true);
    showToast('💎 EFSANE SANDIK!', '+' + gold + ' altın, tam can, +15 XP');
    Snd.evolve(); shake = 20;
    if (player.xp >= player.xpNext) levelUp();
  } else {
    var goldAmt = Math.round((25 + Math.floor(Math.random()*35)) * currentMap.goldMult);
    goldCollected += goldAmt;
    spawnFloater(player.x, player.y-40, '+' + goldAmt + ' 💰', '#ffd166', false);
    Snd.gold();
  }
}

function updateParticles(dt){
  for (var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    if (p.type === 'spark'){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.94; p.vy *= 0.94; }
    else if (p.type === 'poison'){
      p.tickTimer += dt;
      if (p.tickTimer >= 0.5){
        p.tickTimer = 0;
        for (var j=enemies.length-1;j>=0;j--){
          var en = enemies[j];
          var dxp = en.x - p.x;
          var dyp = en.y - p.y;
          if (dxp*dxp + dyp*dyp < p.radius*p.radius){
            var key = en.x + '_' + en.y + '_' + Math.floor(now/500);
            if (!p.hitSet[key]){ p.hitSet[key] = true; applyDamage(en, p.dmg); }
          }
        }
      }
    } else if (p.type === 'root'){
      if (!p.hasHit){
        var dxr = player.x - p.x;
        var dyr = player.y - p.y;
        if (dxr*dxr + dyr*dyr < p.radius*p.radius){
          if (gameTime > player.invulnUntil){
            player.hp -= p.dmg;
            player.invulnUntil = gameTime + 700;
            player.hitFlash = 0.3;
            Snd.hurt();
            p.hasHit = true;
            if (player.hp <= 0){ player.hp = 0; gameOver(); return; }
          }
        }
      }
    } else if (p.type === 'freeze'){
      if (!p.hasHit){
        var dxf = player.x - p.x;
        var dyf = player.y - p.y;
        if (dxf*dxf + dyf*dyf < p.radius*p.radius){
          if (gameTime > player.invulnUntil){
            player.hp -= 10;
            player.invulnUntil = gameTime + 1500;
            player.hitFlash = 0.5;
            Snd.hurt();
            p.hasHit = true;
            if (player.hp <= 0){ player.hp = 0; gameOver(); return; }
          }
        }
      }
    }
  }
}

function updateDamageNumbers(dt){
  for (var i=damageNumbers.length-1;i>=0;i--){
    var d = damageNumbers[i];
    d.life -= dt; d.y += d.vy*dt; d.vy *= 0.94;
    if (d.life <= 0) damageNumbers.splice(i, 1);
  }
}

function updateSpawn(dt){
  var t = gameTime/1000;
  var interval = Math.max(0.12, 0.9 - t*0.018);
  enemySpawnTimer -= dt;
  if (enemySpawnTimer <= 0){
    enemySpawnTimer = interval;
    spawnEnemy();
    if (t > 60) spawnEnemy();
    if (t > 120) spawnEnemy();
    if (t > 180) spawnEnemy();
  }
  if (gameTime > nextBossTime){ spawnBoss(); nextBossTime += 45000; }
}

function updateMilestones(){
  var sec = Math.floor(gameTime/1000);
  if (sec >= nextMilestone){
    showMilestone(nextMilestone/60 + ' DAKİKA');
    showToast('⏱ '+nextMilestone/60+' DAKİKA!', 'Dayan!');
    Snd.milestone();
    nextMilestone += 60;
  }
}

function updateComboTimer(dt){
  if (comboActive > 0){
    comboActive -= dt*1000;
    if (comboActive <= 0){ comboActive = 0; killStreak = 0; }
    updateComboBadge();
  }
}

function updateBossBar(){
  if (activeBoss && activeBoss.hp > 0){
    document.getElementById('bossBarFill').style.width = Math.max(0, activeBoss.hp/activeBoss.maxHp*100)+'%';
  }
}

function levelUp(){
  player.xp -= player.xpNext;
  player.xpNext = Math.floor(player.xpNext*1.4) + 4;
  player.level++;
  STATE = 'levelup';
  Snd.levelUp();
  showUpgradeScreen();
}

function getUpgradeOptions(){
  var opts = [];
  var names = { knife:'Bıçak', spear:'Mızrak', fireball:'Ateş', lightning:'Şimşek', boomerang:'Bumerang', poison:'Zehir', hammer:'Çekiç', iceSpear:'Buz Mızrağı', flameSword:'Alev Kılıcı' };
  for (var key in weapons){
    var w = weapons[key];
    if (w && w.level > 0 && w.level < 3 && !w.evolved){
      opts.push({ id:'w_'+key, icon:'⚔️', name:names[key] || 'Silah', desc:'Hasar +%25', lvl:w.level });
    }
    if (!w || w.level === 0){
      opts.push({ id:'w_'+key, icon:'✨', name:'Yeni Silah', desc:'Yeni silah aç', lvl:0, isNewWeapon:key });
    }
  }
  for (var pk in passives){
    var p = passives[pk];
    if (p.level < 5){ opts.push({ id:'p_'+pk, icon:p.icon, name:p.name, desc:p.desc, lvl:p.level }); }
  }
  opts.sort(function(){ return Math.random()-0.5; });
  return opts.slice(0, 3);
}

function showUpgradeScreen(){
  var list = document.getElementById('upgradeList');
  list.innerHTML = '';
  var opts = getUpgradeOptions();
  for (var i=0;i<opts.length;i++){
    var o = opts[i];
    var card = document.createElement('div');
    card.className = 'upgradeCard';
    card.innerHTML = '<div class="icon">'+o.icon+'</div>'+'<div class="info">'+'<div class="name">'+o.name+'</div>'+'<div class="desc">'+o.desc+'</div>'+'<div class="lvl">'+(o.lvl > 0 ? 'Seviye '+o.lvl : 'YENİ')+'</div>'+'</div>';
    (function(opt){ card.addEventListener('click', function(){ pickUpgrade(opt); }); })(o);
    list.appendChild(card);
  }
  document.getElementById('levelUpScreen').style.display = 'flex';
}

function pickUpgrade(o){
  Snd.click();
  if (o.id.indexOf('p_') === 0){
    var pk = o.id.substring(2);
    passives[pk].level++;
    if (pk === 'speed') player.speed += 15;
    if (pk === 'crit') player.critChance += 0.10;
    if (pk === 'regen') player.regenRate += 2;
  } else if (o.id.indexOf('w_') === 0){
    var wk = o.id.substring(2);
    if (!weapons[wk]) weapons[wk] = { level:0, timer:0, evolved:false };
    if (o.isNewWeapon) weapons[wk].level = 1;
    else weapons[wk].level++;
  }
  document.getElementById('levelUpScreen').style.display = 'none';
  STATE = 'playing';
  lastTime = performance.now();
  updateWeaponIcons();
}

function render(){
  var camX = cam.x - W/2 + (shake > 0.5 ? (Math.random()-0.5)*shake : 0);
  var camY = cam.y - H/2 + (shake > 0.5 ? (Math.random()-0.5)*shake : 0);
  if (bgPattern){
    ctx.save();
    var ox = -((camX % bgTile) + bgTile) % bgTile - bgTile;
    var oy = -((camY % bgTile) + bgTile) % bgTile - bgTile;
    ctx.translate(ox, oy);
    ctx.fillStyle = bgPattern;
    ctx.fillRect(0, 0, W + bgTile*2, H + bgTile*2);
    ctx.restore();
  } else {
    ctx.fillStyle = currentMap.ground;
    ctx.fillRect(0, 0, W, H);
  }

  for (var i=0;i<particles.length;i++){
    var p = particles[i];
    var sx = p.x - camX, sy = p.y - camY;
    if (p.type === 'poison'){
      var alpha = Math.min(1, p.life / p.maxLife);
      var scale = 1 + (1 - p.life/p.maxLife) * 0.3;
      var r = p.radius * scale;
      var gradP = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      gradP.addColorStop(0, 'rgba(120,200,80,' + (alpha*0.5) + ')');
      gradP.addColorStop(0.7, 'rgba(80,150,40,' + (alpha*0.25) + ')');
      gradP.addColorStop(1, 'rgba(40,80,20,0)');
      ctx.fillStyle = gradP;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    } else if (p.type === 'root'){
      ctx.globalAlpha = p.life/p.maxLife * 0.7;
      ctx.strokeStyle = '#4a7a2a'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(sx, sy, p.radius, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.type === 'slowzone'){
      ctx.globalAlpha = p.life/p.maxLife * 0.4;
      var gradS = ctx.createRadialGradient(sx, sy, 0, sx, sy, p.radius);
      gradS.addColorStop(0, 'rgba(180,120,80,0.5)');
      gradS.addColorStop(1, 'rgba(80,50,20,0)');
      ctx.fillStyle = gradS;
      ctx.beginPath(); ctx.arc(sx, sy, p.radius, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'freeze'){
      ctx.globalAlpha = p.life/p.maxLife * 0.6;
      var gradF = ctx.createRadialGradient(sx, sy, 0, sx, sy, p.radius);
      gradF.addColorStop(0, 'rgba(150,220,255,0.6)');
      gradF.addColorStop(1, 'rgba(80,150,200,0)');
      ctx.fillStyle = gradF;
      ctx.beginPath(); ctx.arc(sx, sy, p.radius, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'flameRing'){
      ctx.globalAlpha = p.life/p.maxLife * 0.6;
      ctx.strokeStyle = '#ff6020'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(sx, sy, p.radius * (1 - p.life/p.maxLife), 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  for (var i=0;i<gems.length;i++){
    var g = gems[i];
    var sx = g.x - camX, sy = g.y - camY;
    var r = g.value >= 5 ? 9 : g.value >= 3 ? 8 : g.value >= 2 ? 6 : 5;
    var col = g.value >= 5 ? '#c060ff' : '#5fb390';
    var grad2 = ctx.createRadialGradient(sx, sy, 0, sx, sy, r*2);
    grad2.addColorStop(0, col); grad2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad2;
    ctx.beginPath(); ctx.arc(sx, sy, r*2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
  }

  for (var i=0;i<chests.length;i++){
    var c = chests[i];
    var sx = c.x - camX, sy = c.y - camY;
    var pulse = 1 + Math.sin(now*0.006 + i)*0.08;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(pulse, pulse);
    var glowColor = '#ffd166';
    if (c.chestType === 'heal') glowColor = '#5fb35f';
    else if (c.chestType === 'xp') glowColor = '#5fd3c4';
    else if (c.chestType === 'buff') glowColor = '#a060d0';
    else if (c.chestType === 'legendary') glowColor = '#ff40d0';
    var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 32);
    grad.addColorStop(0, glowColor); grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.3 + Math.sin(now*0.008 + i)*0.15;
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#4a2a10'; ctx.fillRect(-14, -14, 28, 28);
    ctx.fillStyle = '#a08040'; ctx.fillRect(-16, -16, 32, 4); ctx.fillRect(-3, -14, 6, 28);
    ctx.fillStyle = glowColor; ctx.fillRect(-3, -3, 6, 6);
    ctx.restore();
  }

  for (var i=0;i<enemies.length;i++){
    var e = enemies[i];
    var sx = e.x - camX, sy = e.y - camY;
    if (sx < -80 || sx > W+80 || sy < -80 || sy > H+80) continue;
    drawEnemy(e, camX, camY);
  }

  for (var i=0;i<bullets.length;i++){
    var b = bullets[i];
    var sx = b.x - camX, sy = b.y - camY;
    if (b.type === 'knife'){
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
      ctx.shadowColor = '#e0e0ff'; ctx.shadowBlur = 8;
      ctx.fillStyle = b.color; ctx.fillRect(-12, -3, 24, 6);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#5a4a30'; ctx.fillRect(-15, -2, 5, 4);
      ctx.restore();
    } else if (b.type === 'spear' || b.type === 'iceSpear'){
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
      ctx.shadowColor = b.color; ctx.shadowBlur = 10;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.moveTo(-20, 0); ctx.lineTo(12, -6); ctx.lineTo(20, 0); ctx.lineTo(12, 6);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#4a2a10'; ctx.fillRect(-26, -2, 10, 4);
      ctx.restore();
    } else if (b.type === 'fireball'){
      var grad3 = ctx.createRadialGradient(sx, sy, 0, sx, sy, b.radius*2);
      grad3.addColorStop(0, b.isEnemyBullet ? '#ff8040' : '#ffd166');
      grad3.addColorStop(0.5, b.isEnemyBullet ? '#ff4010' : '#ff6020');
      grad3.addColorStop(1, 'rgba(255,96,32,0)');
      ctx.fillStyle = grad3;
      ctx.beginPath(); ctx.arc(sx, sy, b.radius*2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff0c0';
      ctx.beginPath(); ctx.arc(sx, sy, b.radius*0.6, 0, Math.PI*2); ctx.fill();
    } else if (b.type === 'boomerang'){
      var ang = now * 0.008;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
      ctx.shadowColor = b.color; ctx.shadowBlur = 10;
      ctx.strokeStyle = b.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, 8, 0.3, Math.PI - 0.3); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 8, Math.PI + 0.3, Math.PI*2 - 0.3); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    } else if (b.type === 'hammer'){
      ctx.save();
      ctx.translate(sx, sy);
      var scale = b.life / 0.4;
      ctx.scale(scale, scale);
      ctx.fillStyle = 'rgba(255,209,102,' + (0.4 * scale) + ')';
      ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI*2); ctx.fill();
      ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 15;
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  for (var i=0;i<particles.length;i++){
    var p = particles[i];
    if (p.type === 'spark'){
      var sx = p.x - camX, sy = p.y - camY;
      var alpha = p.life/p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(sx, sy, p.radius*alpha, 0, Math.PI*2); ctx.fill();
    } else if (p.type === 'lightning'){
      var x1 = p.x1-camX, y1 = p.y1-camY, x2 = p.x2-camX, y2 = p.y2-camY;
      ctx.globalAlpha = p.life/p.maxLife;
      ctx.strokeStyle = '#ffe080'; ctx.lineWidth = 3;
      ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      for (var s=1;s<5;s++){
        var t = s/5;
        ctx.lineTo(x1+(x2-x1)*t+Math.random()*20-10, y1+(y2-y1)*t+Math.random()*20-10);
      }
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
  ctx.globalAlpha = 1;

  var px2 = player.x - camX, py2 = player.y - camY;
  if (comboActive > 0){
    ctx.strokeStyle = 'rgba(255,176,32,'+(0.5+Math.sin(now*0.01)*0.3)+')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(px2, py2, player.radius+12, 0, Math.PI*2); ctx.stroke();
  }
  drawHero(px2, py2, player.spriteType, player.facing, playerAnimFrame);
  if (player.hitFlash > 0){
    ctx.fillStyle = 'rgba(255,220,180,'+Math.min(0.8, player.hitFlash*1.5)+')';
    ctx.beginPath(); ctx.arc(px2, py2, player.radius+8, 0, Math.PI*2); ctx.fill();
  }
  if (gameTime < player.invulnUntil){
    ctx.strokeStyle = 'rgba(255,220,180,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px2, py2, player.radius+8, 0, Math.PI*2); ctx.stroke();
  }

  if (input.active && input.mag > 0.1){
    ctx.strokeStyle = 'rgba(200,180,140,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W/2, H/2, 60, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,209,102,0.5)';
    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.arc(W/2+input.dx*50, H/2+input.dy*50, 18, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (vignetteCanvas){ ctx.drawImage(vignetteCanvas, 0, 0, W, H); }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i=0;i<damageNumbers.length;i++){
    var d = damageNumbers[i];
    var sx = d.x - camX, sy = d.y - camY;
    var alpha = Math.min(1, d.life/d.maxLife*2);
    ctx.globalAlpha = alpha;
    var fs = d.isFloater ? (d.big ? 26 : 18) : (d.big ? 24 : 18);
    ctx.font = 'bold '+fs+'px Rajdhani, sans-serif';
    ctx.strokeStyle = '#000'; ctx.lineWidth = d.big ? 5 : 4;
    ctx.strokeText(d.text, sx, sy);
    ctx.fillStyle = d.color || '#ffd166';
    ctx.fillText(d.text, sx, sy);
  }
  ctx.globalAlpha = 1;
}

function updateUI(){
  document.getElementById('hpFill').style.width = Math.max(0, player.hp/player.maxHp*100)+'%';
  document.getElementById('hpText').textContent = Math.ceil(player.hp) + ' / ' + player.maxHp;
  document.getElementById('xpFill').style.width = Math.min(100, player.xp/player.xpNext*100)+'%';
  var sec = Math.floor(gameTime/1000);
  var m = Math.floor(sec/60), s = sec%60;
  document.getElementById('timeDisplay').textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  document.getElementById('killsDisplay').textContent = kills;
  document.getElementById('goldDisplay').textContent = goldCollected;
  updateWeaponIcons();
}

function loop(t){
  requestAnimationFrame(loop);
  now = t;
  if (STATE === 'playing'){
    var dt = Math.min(0.05, (t-lastTime)/1000);
    lastTime = t;
    gameTime += dt*1000;
    updatePlayer(dt);
    updateWaves();
    updateSpawn(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateGems(dt);
    updateChests(dt);
    updateParticles(dt);
    updateDamageNumbers(dt);
    updateWeapons(dt);
    updateBossMechanic(dt);
    updateMilestones();
    updateComboTimer(dt);
    updateBossBar();
    updateUI();
    if (shake > 0.3) shake *= 0.85; else shake = 0;
  }
  if (STATE === 'playing' || STATE === 'levelup' || STATE === 'gameover'){ render(); }
}

function resetGame(){
  gameTime = 0; kills = 0; goldCollected = 0;
  enemies = []; bullets = []; gems = []; damageNumbers = [];
  particles = []; chests = [];
  enemySpawnTimer = 0; nextBossTime = 45000; activeBoss = null;
  nextMilestone = 60; lastKillTime = 0; killStreak = 0; comboActive = 0; shake = 0;
  totalDamage = 0; totalCrits = 0; gemsCollected = 0; bossesKilled = 0;
  playerAnimFrame = 0; playerAnimTimer = 0;
  bossMechanicTimer = 0;
  wave = 1;
  currentMap = MAPS[selectedMap];
  currentWaveTypes = [currentMap.enemyTypes[0]];
  buildBg(); buildVignette();
  var ch = CHARACTERS[selectedChar];
  var metaHp = meta.upgrades.hp * 20;
  var metaDmg = 1 + meta.upgrades.damage * 0.1;
  var metaSpeed = meta.upgrades.speed * 15;
  var metaCd = 1 - meta.upgrades.cooldown * 0.05;
  var metaCrit = meta.upgrades.crit * 0.05;
  var metaRegen = meta.upgrades.regen * 1;
  player.x = 0; player.y = 0;
  player.maxHp = ch.hp + metaHp;
  player.hp = player.maxHp;
  player.speed = ch.speed + metaSpeed;
  player.level = 1; player.xp = 0; player.xpNext = 5;
  player.invulnUntil = 0; player.hitFlash = 0; player.facing = 1;
  player.damageMult = ch.damageMult * metaDmg;
  player.cooldownMult = metaCd;
  player.critChance = metaCrit;
  player.critMult = 2.0;
  player.regenRate = metaRegen + (ch.regenBonus || 0);
  player.regenTimer = 0;
  player.spriteType = ch.spriteType;
  for (var pk in passives) passives[pk].level = 0;
  resetWeapons(ch.weapon);
  cam.x = 0; cam.y = 0;
  input.active = false; input.mag = 0;
  document.getElementById('bossBar').style.display = 'none';
  document.getElementById('bossName').style.display = 'none';
  updateWeaponIcons();
}

function startGame(){
  initAudio();
  if (!isMapUnlocked(MAPS[selectedMap])){
    showToast('🔒 Harita kilitli!', 'Önce şartları tamamla');
    return;
  }
  resetGame();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('metaScreen').style.display = 'none';
  document.getElementById('levelUpScreen').style.display = 'none';
  STATE = 'playing';
  lastTime = performance.now();
  updateUI();
  stopMusic();
  startMusic('game');
}

function gameOver(){
  STATE = 'gameover';
  meta.gold += goldCollected;
  meta.lifetimeKills += kills;
  meta.lifetimeBosses += bossesKilled;
  saveMeta();
  stopMusic();
  startMusic('menu');
  var sec = Math.floor(gameTime/1000);
  var m = Math.floor(sec/60), s = sec%60;
  document.getElementById('finalTime').textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  document.getElementById('finalKills').textContent = kills;
  document.getElementById('finalLevel').textContent = player.level;
  document.getElementById('goldEarned').textContent = goldCollected;
  document.getElementById('statDamage').textContent = Math.round(totalDamage);
  document.getElementById('statCrit').textContent = totalCrits;
  document.getElementById('statGems').textContent = gemsCollected;
  document.getElementById('statBosses').textContent = bossesKilled;
  document.getElementById('gameOverScreen').style.display = 'flex';
}

function restartGame(){ startGame(); }
function backToMenu(){
  STATE = 'start';
  stopMusic();
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
  renderCharGrid();
  renderMapGrid();
  updateStartScreenStats();
}
function updateStartScreenStats(){
  document.getElementById('startGold').textContent = meta.gold;
  document.getElementById('lifetimeKills').textContent = meta.lifetimeKills;
  document.getElementById('lifetimeBosses').textContent = meta.lifetimeBosses;
}

function renderCharGrid(){
  var grid = document.getElementById('charGrid');
  if (!grid) return;
  grid.innerHTML = '';
  for (var i=0;i<CHARACTERS.length;i++){
    var c = CHARACTERS[i];
    var card = document.createElement('div');
    card.className = 'charCard' + (i === selectedChar ? ' selected' : '');
    card.innerHTML = '<div class="emoji">'+c.emoji+'</div>'+'<div class="name">'+c.name+'</div>'+'<div class="wep">'+c.desc+'</div>';
    (function(idx){ card.addEventListener('click', function(){ Snd.click(); selectedChar = idx; renderCharGrid(); }); })(i);
    grid.appendChild(card);
  }
}

function renderMapGrid(){
  var grid = document.getElementById('mapGrid');
  if (!grid) return;
  grid.innerHTML = '';
  for (var i=0;i<MAPS.length;i++){
    var m = MAPS[i];
    var unlocked = isMapUnlocked(m);
    var card = document.createElement('div');
    card.className = 'mapCard' + (i === selectedMap ? ' selected' : '') + (!unlocked ? ' locked' : '');
    var previewStyle = 'background:linear-gradient(180deg,'+m.bg1+','+m.bg2+')';
    var lockHtml = '';
    if (!unlocked){ lockHtml = '<div class="lockIcon">🔒</div><div class="lock">'+m.unlockText+'</div>'; }
    card.innerHTML = '<div class="mapPreview" style="'+previewStyle+'">'+m.emoji+'</div>'+'<div class="name">'+m.name+'</div>' + lockHtml;
    (function(idx, isUnlocked){
      card.addEventListener('click', function(){
        if (!isUnlocked){ Snd.click(); var mm = MAPS[idx]; showToast('🔒 Kilitli Harita', mm.unlockText + ' gerekli'); return; }
        Snd.click();
        selectedMap = idx;
        renderMapGrid();
      });
    })(i, unlocked);
    grid.appendChild(card);
  }
}

var META_UPGRADES = [
  { id:'hp', icon:'❤️', name:'Can', desc:'+20 max HP', basePrice:30 },
  { id:'damage', icon:'💪', name:'Hasar', desc:'+%10 hasar', basePrice:50 },
  { id:'speed', icon:'👟', name:'Hız', desc:'+15 hareket', basePrice:40 },
  { id:'cooldown', icon:'⚡', name:'Çabukluk', desc:'-%5 bekleme', basePrice:60 },
  { id:'crit', icon:'🎯', name:'Kritik', desc:'+%5 kritik', basePrice:80 },
  { id:'regen', icon:'💚', name:'Yenilenme', desc:'+1 HP/2s', basePrice:100 }
];

function showMeta(){
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('metaScreen').style.display = 'flex';
  renderMeta();
}
function closeMeta(){
  Snd.click();
  document.getElementById('metaScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
  updateStartScreenStats();
}
function renderMeta(){
  document.getElementById('metaGold').textContent = meta.gold;
  var list = document.getElementById('metaList');
  list.innerHTML = '';
  for (var i=0;i<META_UPGRADES.length;i++){
    var u = META_UPGRADES[i];
    var lvl = meta.upgrades[u.id] || 0;
    var price = u.basePrice + lvl * Math.floor(u.basePrice * 0.7);
    var canAfford = meta.gold >= price;
    var row = document.createElement('div');
    row.className = 'metaRow' + (canAfford ? '' : ' disabled');
    row.innerHTML = '<div class="icon">'+u.icon+'</div>'+'<div class="info">'+'<div class="name">'+u.name+' <span style="color:#ffd166">Lv'+lvl+'</span></div>'+'<div class="desc">'+u.desc+'</div>'+'</div>'+'<div class="price">💰 '+price+'</div>';
    (function(up, pr){
      row.addEventListener('click', function(){
        if (meta.gold >= pr){
          meta.gold -= pr;
          meta.upgrades[up.id]++;
          meta.lifetimeGoldSpent += pr;
          saveMeta();
          Snd.click();
          renderMeta();
        }
      });
    })(u, price);
    list.appendChild(row);
  }
}

document.getElementById('btnStart').addEventListener('click', function(){ initAudio(); startGame(); });
document.getElementById('btnMeta').addEventListener('click', function(){ Snd.click(); showMeta(); });
document.getElementById('btnRestart').addEventListener('click', function(){ Snd.click(); restartGame(); });
document.getElementById('btnBackToMenu').addEventListener('click', function(){ Snd.click(); backToMenu(); });
document.getElementById('btnCloseMeta').addEventListener('click', function(){ Snd.click(); closeMeta(); });

function getPointerPos(e){
  var rect = canvas.getBoundingClientRect();
  var t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}
function onDown(e){
  e.preventDefault();
  initAudio();
  if (STATE !== 'playing') return;
  var p = getPointerPos(e);
  input.active = true;
  var dx = p.x - W/2, dy = p.y - H/2;
  var m = Math.sqrt(dx*dx+dy*dy);
  if (m > 5){ input.dx = dx/m; input.dy = dy/m; input.mag = Math.min(1, m/80); }
}
function onMove(e){
  if (STATE !== 'playing' || !input.active) return;
  e.preventDefault();
  var p = getPointerPos(e);
  var dx = p.x - W/2, dy = p.y - H/2;
  var m = Math.sqrt(dx*dx+dy*dy);
  if (m > 5){ input.dx = dx/m; input.dy = dy/m; input.mag = Math.min(1, m/80); }
}
function onUp(e){ input.active = false; input.mag = 0; input.dx = 0; input.dy = 0; }

canvas.addEventListener('pointerdown', function(e){ try{ canvas.setPointerCapture(e.pointerId);}catch(err){} onDown(e); }, {passive:false});
canvas.addEventListener('pointermove', onMove, {passive:false});
canvas.addEventListener('pointerup', onUp, {passive:false});
canvas.addEventListener('pointercancel', onUp, {passive:false});
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

// BAŞLATMA
renderCharGrid();
renderMapGrid();
updateStartScreenStats();
resize();
updateWeaponIcons();
requestAnimationFrame(loop);

})();
  </script>
</body>
</html>
